name: 构建所有平台安装包

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ======================== 桌面端 ========================
  build-linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx electron-builder --linux --publish=never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - uses: actions/upload-artifact@v4
        with:
          name: 几何决斗-Linux-桌面版
          path: desktop-app/dist/几何决斗*.AppImage

  build-windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx electron-builder --win --publish=never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - uses: actions/upload-artifact@v4
        with:
          name: 几何决斗-Windows-桌面版
          path: desktop-app/dist/几何决斗*.exe

  build-macos:
    runs-on: macos-latest
    defaults: { run: { working-directory: desktop-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx electron-builder --mac --publish=never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - uses: actions/upload-artifact@v4
        with:
          name: 几何决斗-macOS-桌面版
          path: desktop-app/dist/几何决斗*.dmg

  # ======================== 网页文件 ========================
  upload-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: 几何决斗-网页版HTML
          path: |
            geometry-wars.html
            geometry-wars-mobile.html
  build-android-mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - run: npm ci
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 几何决斗-Android-鸿蒙-手机版
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk

  # ======================== 固定发布页 ========================
  release:
    needs: [build-linux, build-windows, build-macos, build-android-mobile, upload-html]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 几何决斗-Linux-桌面版
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: 几何决斗-Windows-桌面版
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: 几何决斗-macOS-桌面版
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: 几何决斗-Android-鸿蒙-手机版
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: 几何决斗-网页版HTML
          path: release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版本下载
          body: |
            点击下方文件下载对应平台安装包。

            | 文件 | 系统 |
            |------|------|
            | 几何决斗-Windows-桌面版.zip | Windows 10+ |
            | 几何决斗-macOS-桌面版.zip | macOS |
            | 几何决斗-Linux-桌面版.zip | Linux |
            | 几何决斗-Android-鸿蒙-手机版.zip | Android / 鸿蒙 |
            | 几何决斗-网页版HTML.zip | 网页版 (浏览器打开) |

            更新日志见 [commits](https://github.com/BYX110308/geometry-wars/commits/main)
          files: |
            release/几何决斗-Windows-桌面版/*
            release/几何决斗-macOS-桌面版/*
            release/几何决斗-Linux-桌面版/*
            release/几何决斗-Android-鸿蒙-手机版/*
            release/几何决斗-网页版HTML/*
          draft: false
          prerelease: false
