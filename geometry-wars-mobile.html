<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>几何决斗 · 移动版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0f' rx='4'/><line x1='8' y1='8' x2='24' y2='24' stroke='%23d4a574' stroke-width='2' stroke-linecap='round'/><line x1='24' y1='8' x2='8' y2='24' stroke='%23999' stroke-width='2' stroke-linecap='round'/><rect x='11' y='11' width='10' height='10' fill='none' stroke='%23ddd' stroke-width='1.5'/></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;font-family:'Courier New',monospace;touch-action:manipulation}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:100vw;max-height:100vh;object-fit:contain}

/* rotate hint */
#rotate-hint{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,15,0.95);z-index:100;flex-direction:column;align-items:center;justify-content:center;color:#999;font-size:13px;letter-spacing:3px}
#rotate-hint .icon{font-size:48px;margin-bottom:16px;color:#d4a574;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
@media(orientation:portrait){#rotate-hint{display:flex}}

/* overlays */
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:10}
.overlay.active{pointer-events:auto}
.overlay.active>*{pointer-events:auto}

/* menu */
#menu{background:rgba(10,10,15,0.93)}
#menu h1{font-size:clamp(22px,5vw,40px);color:#ddd;letter-spacing:6px;margin-bottom:4px;text-align:center}
#menu .subtitle{font-size:clamp(10px,2vw,13px);color:#666;letter-spacing:5px;margin-bottom:28px}
.menu-btn{width:min(260px,70vw);padding:11px 0;margin:5px 0;font-size:clamp(12px,2.8vw,14px);letter-spacing:3px;border:1px solid #333;background:transparent;color:#999;cursor:pointer;text-align:center;font-family:'Courier New',monospace;transition:border-color .2s,color .2s;border-radius:2px}
.menu-btn:active,.menu-btn:hover{border-color:#888;color:#ddd}
.menu-btn.secondary{font-size:clamp(10px,2.2vw,11px);width:min(180px,55vw);padding:7px 0;color:#555;margin:3px 0}
.menu-btn.secondary:active,.menu-btn.secondary:hover{border-color:#555;color:#888}
#user-info{color:#666;font-size:clamp(10px,2vw,11px);letter-spacing:2px;margin-bottom:22px;text-align:center}

/* register */
#register{background:rgba(10,10,15,0.94)}
#register h2{font-size:clamp(16px,4vw,20px);color:#ddd;letter-spacing:5px;margin-bottom:14px}
#register .field{margin:5px 0}
#register label{display:block;color:#666;font-size:10px;letter-spacing:2px;margin-bottom:3px}
#register input[type=text],#register input[type=password]{width:min(240px,60vw);padding:9px;font-size:14px;font-family:'Courier New',monospace;background:rgba(255,255,255,0.03);border:1px solid #333;color:#ddd;outline:none;letter-spacing:1px;border-radius:2px}
#register input:focus{border-color:#888}
.color-options{display:flex;gap:6px;margin:3px 0;flex-wrap:wrap;max-width:min(260px,65vw);justify-content:center}
.color-opt{width:26px;height:26px;cursor:pointer;border:2px solid #333;transition:border-color .15s;border-radius:2px}
.color-opt:active,.color-opt:hover{border-color:#888}
.color-opt.selected{border-color:#ddd}
#register .err{color:#c97d8a;font-size:10px;height:14px;margin-top:2px}

/* lobby */
#lobby{background:rgba(10,10,15,0.92)}
#lobby h2{font-size:clamp(16px,4vw,20px);color:#ddd;letter-spacing:5px;margin-bottom:18px}
#lobby .status-text{color:#999;font-size:clamp(10px,2vw,12px);letter-spacing:2px;margin:6px 0;min-height:16px;text-align:center}
#room-code{font-size:clamp(20px,5vw,28px);color:#d4a574;letter-spacing:6px;margin:10px 0;padding:6px 14px;border:1px dashed #444;cursor:pointer;text-align:center}
#room-code:active{border-color:#888}
#join-input{width:min(280px,65vw);padding:9px;font-size:16px;text-align:center;letter-spacing:2px;background:rgba(255,255,255,0.03);border:1px solid #333;color:#ddd;outline:none;margin:5px 0;font-family:'Courier New',monospace;border-radius:2px}
#join-input:focus{border-color:#888}
.spinner{width:16px;height:16px;border:2px solid #333;border-top-color:#888;animation:spin .8s linear infinite;margin:6px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* HUD */
#hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:clamp(30px,8vw,60px);color:#999;font-size:clamp(9px,1.8vw,11px);letter-spacing:2px;pointer-events:none;z-index:5;font-family:'Courier New',monospace}
#hud .val{color:#ddd;font-size:clamp(13px,2.5vw,16px)}
#msg-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ddd;font-size:clamp(12px,2.5vw,15px);letter-spacing:3px;text-align:center;pointer-events:none;z-index:5;display:none;font-family:'Courier New',monospace;line-height:1.6}
.bar-wrap{position:absolute;bottom:clamp(40px,8vh,20px);left:50%;transform:translateX(-50%);display:flex;gap:clamp(20px,5vw,40px);z-index:5;pointer-events:none}
.bar-col{display:flex;flex-direction:column;gap:1px;align-items:center}
.bar{width:min(120px,22vw);height:3px;background:rgba(255,255,255,0.06);overflow:hidden}
.bar-fill{height:100%;transition:width .1s}
.bar-label{color:#555;font-size:clamp(7px,1.3vw,8px);text-align:center;letter-spacing:1px;font-family:'Courier New',monospace}

/* game controls */
#ctrl-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:6;display:none}
#ctrl-layer.active{pointer-events:auto;display:block}
#ctrl-layer.active>*{pointer-events:auto}

/* joystick */
#stick-base{position:absolute;width:90px;height:90px;border:1.5px solid rgba(255,255,255,0.12);border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none}
#stick-thumb{position:absolute;width:36px;height:36px;background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.3);border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none;transition:background .15s}
#stick-thumb.active{background:rgba(255,255,255,0.3)}

/* aim indicator */
#aim-dot{position:absolute;width:6px;height:6px;background:rgba(255,255,255,0.5);border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none}

/* charge ring */
#charge-ring{position:absolute;transform:translate(-50%,-50%);display:none;pointer-events:none}

/* action buttons */
.ctrl-btn{position:absolute;border:1.5px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.55);font-family:'Courier New',monospace;text-align:center;letter-spacing:2px;transition:background .15s,border-color .15s,color .15s,box-shadow .15s;border-radius:4px;font-size:clamp(9px,1.8vw,11px)}
.ctrl-btn:active,.ctrl-btn.pressed{background:rgba(255,255,255,0.18);border-color:rgba(255,255,255,0.6);color:rgba(255,255,255,0.85)}
.ctrl-btn.fire{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.6)}
.ctrl-btn.fire:active,.ctrl-btn.fire.pressed{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.65);color:#fff}
.ctrl-btn.fire.ult-mode{background:rgba(212,165,116,0.12);border-color:rgba(212,165,116,0.45);color:rgba(212,165,116,0.75)}
.ctrl-btn.fire.ult-mode.pressed{background:rgba(212,165,116,0.25);border-color:rgba(212,165,116,0.7);color:#d4a574;box-shadow:0 0 16px rgba(212,165,116,0.35)}
.ctrl-btn.ult{color:rgba(212,165,116,0.55);border-color:rgba(212,165,116,0.25);background:rgba(212,165,116,0.06)}
.ctrl-btn.ult.dim{opacity:0.35;color:rgba(212,165,116,0.2);border-color:rgba(212,165,116,0.1);background:rgba(212,165,116,0.02);animation:none;box-shadow:none}
.ctrl-btn.ult.ready{animation:ult-pulse 1.5s ease-in-out infinite;opacity:1}
@keyframes ult-pulse{0%,100%{border-color:rgba(212,165,116,0.25);box-shadow:0 0 4px rgba(212,165,116,0.1)}50%{border-color:rgba(212,165,116,0.7);box-shadow:0 0 12px rgba(212,165,116,0.3)}}
.ctrl-btn.ult.primed{animation:none;color:#d4a574;background:rgba(212,165,116,0.22);border-color:rgba(212,165,116,0.7);box-shadow:0 0 14px rgba(212,165,116,0.45);opacity:1}
.ctrl-btn.dash{background:rgba(126,168,184,0.08);border-color:rgba(126,168,184,0.2);color:rgba(126,168,184,0.5)}
.ctrl-btn.dash:active,.ctrl-btn.dash.pressed{background:rgba(126,168,184,0.18);border-color:rgba(126,168,184,0.5);color:rgba(126,168,184,0.8)}

/* history */
#history{background:rgba(10,10,15,0.92)}
#history h2{font-size:clamp(16px,4vw,20px);color:#ddd;letter-spacing:5px;margin-bottom:14px}
#history .tab-row{display:flex;gap:0;margin-bottom:12px;border-bottom:1px solid #222;width:min(360px,85vw)}
#history .tab-btn{flex:1;padding:7px 0;font-size:12px;letter-spacing:2px;color:#555;background:none;border:none;cursor:pointer;font-family:'Courier New',monospace}
#history .tab-btn.on{color:#d4a574;border-bottom:2px solid #d4a574}
#history .tab-content{max-height:240px;overflow-y:auto;display:none;width:min(400px,88vw);-webkit-overflow-scrolling:touch}
#history .tab-content.on{display:block}
#history .list-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid #1a1a1a;font-size:clamp(10px,2vw,12px);letter-spacing:1px;color:#777}
#history .result-win{color:#9db88f}
#history .result-lose{color:#c97d8a}
#history .room-code-sm{color:#d4a574;letter-spacing:2px;font-weight:bold;cursor:pointer}
#history .room-code-sm:active{color:#fff}
#history .list-empty{text-align:center;padding:30px 16px;color:#444;font-size:12px;letter-spacing:2px}
#history .stat-bar{display:flex;gap:10px;margin-bottom:12px;width:min(360px,85vw)}
#history .stat-item{flex:1;text-align:center;padding:6px;background:rgba(255,255,255,0.02);border:1px solid #1a1a1a}
#history .stat-num{font-size:18px;color:#d4a574;letter-spacing:1px}
#history .stat-label{font-size:9px;color:#555;letter-spacing:1px;margin-top:1px}

/* admin */
#admin-panel h2{font-size:clamp(16px,4vw,20px);color:#ddd;letter-spacing:5px;margin-bottom:14px}
#admin-pw{width:min(200px,55vw);padding:9px;font-size:14px;text-align:center;letter-spacing:2px;background:rgba(255,255,255,0.03);border:1px solid #333;color:#ddd;outline:none;font-family:'Courier New',monospace;margin:6px 0;border-radius:2px}
#admin-err{color:#c97d8a;font-size:10px;height:14px;margin:3px 0}

/* more & edit mode */
#more{background:rgba(10,10,15,0.92)}
#more h2{font-size:clamp(16px,4vw,20px);color:#ddd;letter-spacing:5px;margin-bottom:18px}
.edit-mode .ctrl-btn{border-style:dashed !important;transition:none}
.edit-mode .ctrl-btn.selected{border-style:solid !important;border-color:#d4a574 !important;box-shadow:0 0 12px rgba(212,165,116,0.45)}
</style>
</head>
<body>

<div id="rotate-hint">
  <div class="icon">↻</div>
  <div>请旋转设备至横屏</div>
  <div style="font-size:9px;color:#555;margin-top:6px;letter-spacing:2px;">ROTATE TO LANDSCAPE</div>
</div>

<div id="wrap">
  <canvas id="c"></canvas>

  <!-- controls -->
  <div id="ctrl-layer">
    <div id="stick-base"></div>
    <div id="stick-thumb"></div>
    <div id="aim-dot"></div>
    <canvas id="charge-ring" width="80" height="80"></canvas>
    <button class="ctrl-btn dash" id="btn-dash" style="width:46px;height:46px;border-radius:50%;bottom:clamp(80px,15vh,110px);right:clamp(126px,24vw,166px);font-size:8px" data-d-b="clamp(80px,15vh,110px)" data-d-r="clamp(126px,24vw,166px)">DASH</button>
    <button class="ctrl-btn fire" id="btn-fire" style="width:clamp(56px,11vw,66px);height:clamp(56px,11vw,66px);border-radius:50%;bottom:clamp(80px,15vh,110px);right:clamp(50px,10vw,100px);font-size:clamp(10px,1.8vw,12px);letter-spacing:1px" data-d-b="clamp(80px,15vh,110px)" data-d-r="clamp(50px,10vw,100px)">FIRE</button>
    <button class="ctrl-btn ult dim" id="btn-ult" style="width:clamp(30px,6vw,38px);height:clamp(30px,6vw,38px);border-radius:50%;bottom:clamp(152px,26vh,178px);right:clamp(64px,12vw,113px);font-size:clamp(6px,1.2vw,8px);letter-spacing:1px" data-d-b="clamp(152px,26vh,178px)" data-d-r="clamp(64px,12vw,113px)">U</button>
    <button class="ctrl-btn" id="btn-menu" style="width:clamp(32px,6vw,40px);height:clamp(32px,6vw,40px);border-radius:50%;top:clamp(6px,1.5vh,12px);right:clamp(6px,1.5vw,12px);font-size:8px;letter-spacing:0;position:absolute">✕</button>
  </div>

  <!-- menu -->
  <div id="menu" class="overlay active">
    <h1>几何决斗</h1>
    <div class="subtitle">GEOMETRY WARS · 移动版</div>
    <div id="user-info"><span>未注册</span></div>
    <button class="menu-btn" id="btn-start-ai" onclick="startAI()">人机对战</button>
    <button class="menu-btn" id="btn-start-online" onclick="showLobby()">联机对战</button>
    <button class="menu-btn secondary" onclick="showRegister()">注册 / 切换账号</button>
    <button class="menu-btn secondary" onclick="showMore()">更多</button>
    <button class="menu-btn secondary" onclick="showAdmin()">管理</button>
  </div>

  <!-- register -->
  <div id="register" class="overlay" style="display:none">
    <h2>注册账号</h2>
    <div class="field"><label>玩家名称</label><input type="text" id="reg-name" maxlength="12" placeholder="输入名称..."></div>
    <div class="field"><label>密码</label><input type="password" id="reg-pass" maxlength="16" placeholder="输入密码..."></div>
    <div class="field"><label>选择颜色</label><div class="color-options" id="color-options"></div></div>
    <div class="err" id="reg-err"></div>
    <button class="menu-btn" onclick="doRegister()">确认</button>
    <button class="menu-btn secondary" onclick="backToMenu()">返回</button>
  </div>

  <!-- lobby -->
  <div id="lobby" class="overlay" style="display:none">
    <h2>联机对战</h2>
    <button class="menu-btn" onclick="createRoom()">创建房间</button>
    <div class="status-text" id="lobby-status"></div>
    <div id="room-code" style="display:none"></div>
    <input type="text" id="join-input" placeholder="输入6位房间码..." maxlength="6">
    <button class="menu-btn" onclick="joinRoom()">加入房间</button>
    <div class="spinner" id="lobby-spinner" style="display:none"></div>
    <button class="menu-btn secondary" onclick="disconnectAndMenu()">返回</button>
  </div>

  <!-- history -->
  <div id="history" class="overlay" style="display:none">
    <h2>历史记录</h2>
    <div class="tab-row">
      <button class="tab-btn on" onclick="switchHistoryTab('record')">战绩</button>
      <button class="tab-btn" onclick="switchHistoryTab('room')">房间</button>
    </div>
    <div class="tab-content on" id="tab-record"><div class="stat-bar" id="stats-bar"></div><div id="record-list"></div></div>
    <div class="tab-content" id="tab-room"><div id="room-list"></div></div>
    <button class="menu-btn secondary" onclick="backToMenu()" style="margin-top:12px">返回</button>
  </div>

  <!-- 更多 -->
  <div id="more" class="overlay" style="display:none">
    <h2>更多选项</h2>
    <button class="menu-btn" onclick="enterEditMode()">改键位</button>
    <button class="menu-btn" onclick="showHistoryFromMore()">历史战绩</button>
    <button class="menu-btn secondary" onclick="backToMenu()" style="margin-top:10px">返回</button>
  </div>

  <!-- 改键位操作栏 -->
  <div id="edit-bar" style="display:none;position:absolute;bottom:clamp(4px,1vh,10px);left:50%;transform:translateX(-50%);z-index:20;gap:6px;align-items:center">
    <button class="menu-btn secondary" id="eb-smaller" onclick="resizeSelected(-8)" style="width:28px;height:28px;padding:0;margin:0;font-size:14px;line-height:26px;border-radius:50%">−</button>
    <span id="eb-size" style="color:#888;font-size:clamp(9px,1.6vw,10px);letter-spacing:1px;min-width:36px;text-align:center">--</span>
    <button class="menu-btn secondary" id="eb-larger" onclick="resizeSelected(8)" style="width:28px;height:28px;padding:0;margin:0;font-size:14px;line-height:26px;border-radius:50%">+</button>
    <button class="menu-btn secondary" onclick="resetLayout()" style="width:auto;padding:5px 10px;margin:0 0 0 8px;font-size:clamp(9px,1.8vw,11px)">默认</button>
    <button class="menu-btn secondary" onclick="exitEditMode(true)" style="width:auto;padding:5px 10px;margin:0;font-size:clamp(9px,1.8vw,11px);border-color:#d4a574;color:#d4a574">完成</button>
  </div>

  <!-- admin -->
  <div id="admin-panel" class="overlay" style="display:none">
    <h2>管理员验证</h2>
    <input type="password" id="admin-pw" maxlength="20" placeholder="输入管理密码...">
    <div class="err" id="admin-err"></div>
    <button class="menu-btn" onclick="adminVerify()">确认</button>
    <button class="menu-btn secondary" onclick="backToMenu()">返回</button>
  </div>

  <!-- HUD -->
  <div id="hud" style="display:none">
    <div><span id="p1-label">玩家</span> <span class="val" id="ps">0</span></div>
    <div id="round-indicator" style="color:#666;font-size:clamp(9px,1.8vw,11px);letter-spacing:3px">B 0 - 0</div>
    <div><span id="p2-label">对手</span> <span class="val" id="ais" style="color:#f0f">0</span></div>
  </div>
  <div id="msg-overlay"></div>
  <div class="bar-wrap" id="bar-wrap" style="display:none">
    <div class="bar-col" id="bar-col-1"></div>
    <div class="bar-col" id="bar-col-2"></div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ===================== GAME CONSTANTS =====================
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const GW = 900, GH = 600;
let scale = 1;

function resizeCanvas() {
  const ww = window.innerWidth;
  const wh = window.innerHeight;
  scale = Math.min(ww / GW, wh / GH);
  c.width = GW;
  c.height = GH;
  c.style.width = (GW * scale) + 'px';
  c.style.height = (GH * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
resizeCanvas();

// ===================== COLORS & VERSION =====================
const VERSION = 23;
const UPDATE_URL = 'https://gitee.com/byx0308/geometry-wars/raw/main/geometry-wars-mobile.html';

const COLORS = [
  {name:'白',hex:'#e0e0e0',rgb:'rgba(224,224,224,0.15)'},
  {name:'灰',hex:'#909090',rgb:'rgba(144,144,144,0.15)'},
  {name:'橙',hex:'#d4a574',rgb:'rgba(212,165,116,0.15)'},
  {name:'青',hex:'#7ea8b8',rgb:'rgba(126,168,184,0.15)'},
  {name:'绿',hex:'#9db88f',rgb:'rgba(157,184,143,0.15)'},
  {name:'赤',hex:'#c97d8a',rgb:'rgba(201,125,138,0.15)'},
  {name:'紫',hex:'#9a9bcf',rgb:'rgba(154,155,207,0.15)'},
  {name:'黄',hex:'#c9c090',rgb:'rgba(201,192,144,0.15)'}
];

// ===================== AUTO UPDATE =====================
(function checkUpdate(bg) {
  if (!UPDATE_URL) return;
  const loc = window.location.href;
  if (loc.startsWith(UPDATE_URL)) return;
  fetch(UPDATE_URL + '?_t=' + Date.now(), {cache:'no-store'})
    .then(r => { if (!r.ok) throw new Error('status ' + r.status); return r.text(); })
    .then(html => {
      const m = html.match(/const\s+VERSION\s*=\s*(\d+)/);
      if (!m) return;
      if (parseInt(m[1]) > VERSION) {
        if (bg && gameMode && !gameOver) {
          const ov = document.getElementById('msg-overlay');
          ov.style.display = 'block';
          ov.innerHTML = '发现新版本<br><span style="font-size:10px;color:#888">比赛结束后自动更新</span>';
          window._updatePending = UPDATE_URL;
          setTimeout(() => { if (ov.textContent.includes('新版本')) ov.style.display = 'none'; }, 4000);
        } else {
          document.title = '几何决斗 - 正在更新...';

    const sx = t.clientX - rect.left;
    const sy = t.clientY - rect.top;
    const gx = sx / scale, gy = sy / scale;

      const dx = sx - touchState.moveBaseX;

      moveStickThumb(dx, dy);
      const dist = Math.hypot(dx, dy);

      touchState.moveY = dist > 8 ? (dy / dist) * norm : 0;
    }
    if (t.identifier === editDragId && editTarget) {

let audioCtx = null;
function initAudio() { if (audioCtx) return; try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
function snd(freq, dur, type, vol, fade) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + (fade || dur));
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
  if (navigator.vibrate) navigator.vibrate(Math.min(50, dur * 1000));
}

// ===================== UPDATE LOGIC =====================
function updatePlayerInput(p, dt) {
  if (p.dead || matchOver || killCam.active || roundPause > 0) return;
  if (p.ultiCooldown > 0) { p.ultiCooldown -= dt; if (p.ultiCooldown <= 0) p.ultiCooldown = 0; }
  const target = (p === player) ? opponent : player;
  const canUlt = p.ultiCooldown <= 0 && p.xp >= p.maxXp;
  const fireHeld = (p === player) ? touchState.fireDown : false;
  const ultActive = (p === player) ? (fireHeld && ultPrimed && canUlt) : false;
  const bowActive = (p === player) ? (fireHeld && !ultPrimed) : false;

  // Ult charging via FIRE button when ultPrimed
  if (ultActive) {
    if (!p.ultiCharging) { p.ultiCharging = true; p.ultiChargeProgress = 0; p.ultiMaxTimer = 0; p.ultiLockTimer = 0; p.ultiLocked = false; }
    p.ultiChargeProgress = Math.min(1, p.ultiChargeProgress + dt / 1.2);
    if (p.ultiChargeProgress >= 1.0) {
      p.ultiMaxTimer += dt;
      const distToTarget = Math.hypot(target.x - p.x, target.y - p.y);
      const angleToTarget = Math.atan2(target.y - p.y, target.x - p.x);
      let ad = Math.abs(p.aimAngle - angleToTarget); while (ad > Math.PI) ad = Math.PI * 2 - ad;
      if (ad < 0.22 && distToTarget < 600 && !target.dead) { p.ultiLockTimer += dt; if (p.ultiLockTimer >= 0.4) p.ultiLocked = true; }

function updatePlayerMovement(p, dt, ax, ay) {

  p.y = Math.max(p.r, Math.min(GH - p.r, p.y));
}

  ai.dodgeTimer-=dt; if (ai.dodgeTimer<=0){ai.dodgeTimer=(0.35-ai.difficulty*0.1)+Math.random()*(0.5-ai.difficulty*0.1);ai.dodgeVx=(Math.random()-0.5)*240;ai.dodgeVy=(Math.random()-0.5)*240;}
  if (ai.shotTimestamp>0){ai.shotTimestamp-=dt;if(ai.shotTimestamp<=0&&!player.dead){const ddx=player.x-ai.shotPlayerX,ddy=player.y-ai.shotPlayerY,dd=Math.hypot(ddx,ddy);if(dd>10){ai.playerDodgeBiasX+=(ddx-ai.playerDodgeBiasX)*0.12;ai.playerDodgeBiasY+=(ddy-ai.playerDodgeBiasY)*0.12;}}}
  ai.hitCount=Math.max(0,ai.hitCount-dt*2);ai.missCount=Math.max(0,ai.missCount-dt*2);const ttt=ai.hitCount+ai.missCount;if(ttt>3){const raa=ai.hitCount/ttt;ai.predictionConfidence+=(raa-0.5)*0.15;ai.predictionConfidence=Math.max(0.15,Math.min(1,ai.predictionConfidence));}

// ===================== MAIN UPDATE =====================
function update(dt) {
  if (!gameMode || matchOver) return;
  if (gameMode === 'ai') {
    updatePlayerInput(player, dt); updateAI(dt);
    let ax = 0, ay = 0;
    if (touchState.moveId !== null) {
      ax = touchState.moveX; ay = touchState.moveY;
      const len = Math.hypot(ax, ay); if (len > 1) { ax /= len; ay /= len; }
    }
    updatePlayerMovement(player, dt, ax, ay);
  }
  if (gameMode === 'online') {
    if (remoteState && remoteReady) {
      opponent.x=remoteState.x;opponent.y=remoteState.y;opponent.vx=remoteState.vx;opponent.vy=remoteState.vy;
      opponent.aimAngle=remoteState.aimAngle;opponent.bowCharging=remoteState.bowCharging;opponent.bowCharge=remoteState.bowCharge;
      opponent.arrowCd=remoteState.arrowCd;opponent.ultiCharging=remoteState.ultiCharging;
      opponent.ultiChargeProgress=remoteState.ultiChargeProgress;opponent.ultiCooldown=remoteState.ultiCooldown;
      opponent.xp=remoteState.xp;opponent.hp=remoteState.hp;opponent.dead=remoteState.dead;
    }
    updatePlayerInput(player, dt);
    let ax = 0, ay = 0;
    if (touchState.moveId !== null) { ax = touchState.moveX/38; ay = touchState.moveY/38; const len = Math.hypot(ax,ay); if (len > 1) { ax/=len; ay/=len; } }
    updatePlayerMovement(player, dt, ax, ay);
    opponent.x += opponent.vx*dt; opponent.y += opponent.vy*dt;
    opponent.x = Math.max(opponent.r, Math.min(GW-opponent.r, opponent.x));
    opponent.y = Math.max(opponent.r, Math.min(GH-opponent.r, opponent.y));
    sendTimer += dt;
    if (sendTimer >= SEND_INTERVAL) { sendTimer = 0; sendState(); }
  }
  gridOffsetX = 0; gridOffsetY = 0;
  if (player && !player.dead && !matchOver && !killCam.active && roundPause <= 0) {
    const spd = Math.hypot(player.vx, player.vy), moving = spd > 8 || player.dashing;
    if (moving) { player.stillTimer = Math.max(0, player.stillTimer - dt*2); }
    else { player.stillTimer += dt; if (player.stillTimer > 3.0) { player.hp -= player.maxHp*0.06*dt; if (player.hp <= 0) { player.hp = 0; player.dead = true; if (gameMode==='ai') { startKillCam(ai, player.x, player.y); spawnShatter(player.x, player.y, COLORS[player.colorIdx].hex, player.r); snd(120,0.4,'sawtooth',0.1); } } } }
  }
  for (const arr of [bullets, oppBullets]) { for (let i = arr.length-1; i >= 0; i--) { arr[i].timer -= dt; if (arr[i].timer <= 0) arr.splice(i, 1); } }
  for (const p of [player, opponent, ai]) { if (p && p.ultiBeam) { p.ultiBeam.timer -= dt; if (p.ultiBeam.timer <= 0) p.ultiBeam = null; } }
  if (killCam.active) {
    killCam.timer -= dt; const intensity = killCam.timer/killCam.maxTimer;
    killCam.shakeX = (Math.random()-0.5)*intensity*36; killCam.shakeY = (Math.random()-0.5)*intensity*36;
    killCam.flashAlpha = Math.max(0, intensity*0.6-0.2);
    if (killCam.timer <= 0) {
      killCam.active = false;
      if (gameMode === 'ai' || gameMode === 'online') {
        if (killCam.winner === 'player') roundWins.p1++; else roundWins.p2++;
        if (roundWins.p1 >= ROUNDS_TO_WIN || roundWins.p2 >= ROUNDS_TO_WIN) {
          matchOver = true; const msg = document.getElementById('msg-overlay'); msg.style.display = 'block';
          const won = roundWins.p1 >= ROUNDS_TO_WIN;
          msg.textContent = won ? '比赛胜利！点菜单重来' : (gameMode==='ai'?'AI 获胜！点菜单重来':'你输了！点菜单重来');
          const oppName = gameMode==='ai'?'AI':(remoteUser?remoteUser.name:'对手');
          recordMatch(gameMode, oppName, won, roundWins.p1, roundWins.p2);
          if (window._updatePending) setTimeout(() => { window.location.href = UPDATE_URL + '?_v=' + VERSION; }, 3000);
        } else { roundPause = 1.5; resetRound(); }
      } else { gameOver = true; }
    }
  }
  if (roundPause > 0) { roundPause -= dt; if (roundPause <= 0) resetRound(); }
  if (screenShake > 0) screenShake = Math.max(0, screenShake - dt*28);
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if (p.type==='shatter'){p.vx*=0.92;p.vy*=0.92;p.rot+=p.rotSpd*dt;}
    else{p.vx*=0.94;p.vy*=0.94;}
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = dmgNumbers.length-1; i >= 0; i--) { dmgNumbers[i].life -= dt; if (dmgNumbers[i].life <= 0) dmgNumbers.splice(i, 1); }
  updateHUD();
  // ULT button visual state
  if (player && !matchOver) {
    if (ultPrimed) {
      btnUlt.classList.add('primed'); btnUlt.classList.remove('ready','dim');
      btnFire.classList.add('ult-mode');
    } else if (player.xp >= player.maxXp && player.ultiCooldown <= 0 && !player.ultiCharging) {
      btnUlt.classList.add('ready'); btnUlt.classList.remove('primed','dim');
    } else {
      btnUlt.classList.add('dim'); btnUlt.classList.remove('ready','primed');
    }
  } else {
    btnUlt.classList.add('dim'); btnUlt.classList.remove('ready','primed');
  }
}

  else{document.getElementById('ultbar').style.width='100%';document.getElementById('ultbar').style.background='#d4a574';}

  else if(o.ultiCharging){document.getElementById('aiultbar').style.width=(o.ultiChargeProgress*100)+'%';document.getElementById('aiultbar').style.background=o.ultiChargeProgress>=1?'#d4a574':'#8a7a5a';}

// ===================== RENDER =====================
function drawGrid() {
  ctx.strokeStyle='rgba(30,35,50,0.4)';ctx.lineWidth=0.5;
  for(let x=gridOffsetX;x<GW;x+=gridSize){ctx.beginPath();ctx.moveTo(Math.round(x)+0.5,0);ctx.lineTo(Math.round(x)+0.5,GH);ctx.stroke();}
  for(let y=gridOffsetY;y<GH;y+=gridSize){ctx.beginPath();ctx.moveTo(0,Math.round(y)+0.5);ctx.lineTo(GW,Math.round(y)+0.5);ctx.stroke();}
  ctx.strokeStyle='rgba(50,60,80,0.5)';ctx.lineWidth=0.8;
  const cx=Math.round(GW/2/gridSize)*gridSize+gridOffsetX,cy=Math.round(GH/2/gridSize)*gridSize+gridOffsetY;
  ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,GH);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(GW,cy);ctx.stroke();
}
function drawSquare(x,y,r,angle,color,cp,ic,bc,bch) {
  ctx.save();ctx.translate(x,y);ctx.rotate(angle+Math.PI/4);
  const hex=color,rc=parseInt(hex.slice(1,3),16),gc=parseInt(hex.slice(3,5),16),bc_=parseInt(hex.slice(5,7),16);
  ctx.fillStyle='rgba('+rc+','+gc+','+bc_+',0.08)';const hs=r*0.85;ctx.fillRect(-hs,-hs,hs*2,hs*2);
  ctx.strokeStyle='rgba('+rc+','+gc+','+bc_+',0.9)';ctx.lineWidth=1.5;ctx.strokeRect(-hs,-hs,hs*2,hs*2);
  ctx.fillStyle='rgba('+rc+','+gc+','+bc_+',0.6)';ctx.beginPath();ctx.arc(0,0,2.5,0,Math.PI*2);ctx.fill();
  const ds=hs*0.5;ctx.strokeStyle='rgba('+rc+','+gc+','+bc_+',0.25)';ctx.lineWidth=0.7;
  ctx.beginPath();ctx.moveTo(-ds,-ds);ctx.lineTo(ds,ds);ctx.stroke();ctx.beginPath();ctx.moveTo(ds,-ds);ctx.lineTo(-ds,ds);ctx.stroke();
  if(ic&&cp>0){ctx.strokeStyle='rgba('+rc+','+gc+','+bc_+','+(0.3+cp*0.5)+')';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.beginPath();ctx.arc(0,0,r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*cp);ctx.stroke();ctx.setLineDash([]);}
  if(bch&&bc>0&&!ic){ctx.strokeStyle='rgba('+rc+','+gc+','+bc_+','+(0.2+bc*0.5)+')';ctx.lineWidth=1.2;ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(0,0,r+4,-Math.PI/2,-Math.PI/2+Math.PI*2*bc);ctx.stroke();ctx.setLineDash([]);}
  ctx.restore();
}
function drawUltBeam(beam) {
  if(!beam||beam.timer<=0)return;const a=beam.timer/beam.maxTimer,hex=beam.color,r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16),cl=beam.chargeLevel||0.5;
  const dx=beam.x2-beam.x1,dy=beam.y2-beam.y1,dist=Math.hypot(dx,dy);if(dist<1)return;const px=-dy/dist,py=dx/dist,freq=2+cl*5,amp=8+cl*16;
  [[6,a*0.12],[4,a*0.25],[1.5,a*0.7]].forEach(ls=>{ctx.strokeStyle='rgba('+r+','+g+','+b+','+ls[1]+')';ctx.lineWidth=ls[0];ctx.setLineDash([]);ctx.beginPath();const st=Math.floor(dist/4);for(let i=0;i<=st;i++){const t=i/st,en=Math.sin(t*Math.PI),off=Math.sin(t*Math.PI*2*freq)*amp*en;if(i===0)ctx.moveTo(beam.x1+dx*t+px*off,beam.y1+dy*t+py*off);else ctx.lineTo(beam.x1+dx*t+px*off,beam.y1+dy*t+py*off);}ctx.stroke();});
  ctx.strokeStyle='rgba('+Math.min(255,r+40)+','+Math.min(255,g+40)+','+Math.min(255,b+40)+','+(a*0.9)+')';ctx.lineWidth=1;ctx.beginPath();const sst=Math.floor(dist/4);for(let i=0;i<=sst;i++){const t=i/sst,en=Math.sin(t*Math.PI),off=Math.sin(t*Math.PI*2*freq)*amp*en;if(i===0)ctx.moveTo(beam.x1+dx*t+px*off,beam.y1+dy*t+py*off);else ctx.lineTo(beam.x1+dx*t+px*off,beam.y1+dy*t+py*off);}ctx.stroke();
}
function drawBullet(b) {
  const progress=1-Math.max(0,b.timer/(b.charge>0?0.08+b.charge*0.15:0.08)),alpha=Math.max(0,b.timer/(b.charge>0?0.08+b.charge*0.15:0.08));
  const hex=b.color,rc=parseInt(hex.slice(1,3),16),gc=parseInt(hex.slice(3,5),16),bc_=parseInt(hex.slice(5,7),16),charge=b.charge||0;
  const cx2=b.x1+(b.x2-b.x1)*Math.min(1,progress*1.3),cy2=b.y1+(b.y2-b.y1)*Math.min(1,progress*1.3);
  ctx.strokeStyle='rgba('+rc+','+gc+','+bc_+','+(alpha*0.08)+')';ctx.lineWidth=10+charge*5;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(cx2,cy2);ctx.stroke();
  ctx.strokeStyle='rgba('+rc+','+gc+','+bc_+','+(alpha*0.2)+')';ctx.lineWidth=4+charge*2.5;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(cx2,cy2);ctx.stroke();
  ctx.strokeStyle='rgba('+rc+','+gc+','+bc_+','+(alpha*0.7)+')';ctx.lineWidth=1.5+charge;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(cx2,cy2);ctx.stroke();
  ctx.strokeStyle='rgba('+Math.min(255,rc+40)+','+Math.min(255,gc+40)+','+Math.min(255,bc_+40)+','+(alpha*0.95)+')';ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(cx2,cy2);ctx.stroke();
}
function draw() {
  ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,GW,GH);
  if(gameMode){
    ctx.save();
    if(killCam.active){const intensity=killCam.timer/killCam.maxTimer,zoom=1+intensity*0.15;ctx.translate(GW/2,GH/2);ctx.scale(zoom,zoom);ctx.translate(-GW/2+killCam.shakeX,-GH/2+killCam.shakeY);}
    else if(screenShake>0.3){const sx=(Math.random()-0.5)*screenShake,sy=(Math.random()-0.5)*screenShake;ctx.translate(sx,sy);}
    drawGrid();
    for(const p of particles){
      const alpha=p.life/p.maxLife;
      if(p.type==='shatter'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);const s=p.size*alpha;ctx.fillStyle='rgba('+p.r+','+p.g+','+p.b+','+(alpha*0.9)+')';ctx.strokeStyle='rgba('+Math.min(255,p.r+60)+','+Math.min(255,p.g+60)+','+Math.min(255,p.b+60)+','+alpha+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(-0.35)*s,Math.sin(-0.35)*s);ctx.lineTo(Math.cos(0.35)*s,Math.sin(0.35)*s);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
      else{ctx.fillStyle=p.color.replace(')',';'+alpha+')').replace('rgb','rgba');ctx.beginPath();ctx.arc(p.x,p.y,p.size*alpha,0,Math.PI*2);ctx.fill();}
    }
    for(const dn of dmgNumbers){const a=dn.life/dn.maxLife;ctx.fillStyle=dn.color.replace(')',';'+a+')').replace('rgb','rgba');ctx.font='bold 12px "Courier New",monospace';ctx.textAlign='center';ctx.fillText(dn.text,dn.x,dn.y-(1-a)*16);}
    for(const b of bullets)drawBullet(b);for(const b of oppBullets)drawBullet(b);
    if(player.ultiBeam)drawUltBeam(player.ultiBeam);if(opponent&&opponent.ultiBeam)drawUltBeam(opponent.ultiBeam);if(ai&&ai.ultiBeam)drawUltBeam(ai.ultiBeam);
    const pColor=COLORS[player.colorIdx].hex;if(!player.dead)drawSquare(player.x,player.y,player.r,player.aimAngle,pColor,null,player.ultiChargeProgress,player.ultiCharging,player.bowCharge,player.bowCharging);
    const oColor=COLORS[opponent.colorIdx].hex;if(!opponent.dead)drawSquare(opponent.x,opponent.y,opponent.r,opponent.aimAngle,oColor,null,opponent.ultiChargeProgress,opponent.ultiCharging,opponent.bowCharge,opponent.bowCharging);
    ctx.fillStyle=pColor;ctx.font='10px "Courier New",monospace';ctx.textAlign='center';
    if(!player.dead){ctx.fillText(currentUser.name,player.x,player.y-26);if(player.stillTimer>2.0){const wa=Math.min(1,(player.stillTimer-2.0)/1.0),pa=wa*(0.4+Math.sin(Date.now()*0.008)*0.3);ctx.strokeStyle='rgba(201,125,138,'+pa+')';ctx.lineWidth=2;ctx.setLineDash([4,2]);ctx.beginPath();ctx.arc(player.x,player.y,player.r+10,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,(player.stillTimer-2.0)/1.0));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(201,125,138,'+(wa*0.5)+')';ctx.font='9px "Courier New",monospace';ctx.fillText(player.stillTimer>3.0?'静止惩罚中':'请移动!',player.x,player.y-36);}}
    ctx.fillStyle=oColor;const oName=gameMode==='ai'?'AI':(remoteUser?remoteUser.name:'对手');if(!opponent.dead)ctx.fillText(oName,opponent.x,opponent.y-26);

    // Aim line — dashed ray from player (hidden during cooldown)
    if(!player.dead&&!matchOver&&player.arrowCd<=0){
      const end=getBeamEnd(player.x,player.y,player.aimAngle);
      const isUlt=player.ultiCharging, isBow=player.bowCharging;
      const a=isUlt?0.55:isBow?0.35:0.18, w=isUlt?2.5:isBow?1.8:1.2;
      ctx.strokeStyle='rgba('+parseInt(pColor.slice(1,3),16)+','+parseInt(pColor.slice(3,5),16)+','+parseInt(pColor.slice(5,7),16)+','+a+')';
      ctx.lineWidth=w;ctx.setLineDash([4,5]);
      ctx.beginPath();
      ctx.moveTo(player.x+Math.cos(player.aimAngle)*(player.r+8),player.y+Math.sin(player.aimAngle)*(player.r+8));
      ctx.lineTo(end.x,end.y);ctx.stroke();ctx.setLineDash([]);
    }
    ctx.restore();
    if(killCam.active){const intensity=killCam.timer/killCam.maxTimer;ctx.fillStyle='rgba(10,10,15,'+(killCam.flashAlpha*intensity*0.6)+')';ctx.fillRect(0,0,GW,GH);const er=(1-intensity)*200+30;ctx.strokeStyle='rgba(200,200,200,'+(intensity*0.6)+')';ctx.lineWidth=1+intensity*4;ctx.beginPath();ctx.arc(killCam.posX,killCam.posY,er,0,Math.PI*2);ctx.stroke();}
  }
}

// ===================== LOOP =====================
let lastTime=0,accumulator=0;const fixedDt=1/60;
function loop(time){let rawDt=(time-lastTime)/1000;lastTime=time;if(rawDt>0.1)rawDt=0.1;accumulator+=rawDt;while(accumulator>=fixedDt){if(gameMode&&!gameOver)update(fixedDt);accumulator-=fixedDt;}draw();requestAnimationFrame(loop);}

// ===================== INIT =====================
loadUser();renderColorOptions();if(currentUser)selectedColorIdx=currentUser.colorIdx;loadLayout();
document.getElementById('bar-col-1').innerHTML='<div class="bar"><div class="bar-fill" id="hpbar" style="background:#999;width:100%"></div></div><div class="bar-label">生命</div><div class="bar"><div class="bar-fill" id="xpbar" style="background:#666;width:0%"></div></div><div class="bar-label">经验 0/50</div><div class="bar"><div class="bar-fill" id="bowbar" style="background:#666;width:0%"></div></div><div class="bar-label">y=kx</div><div class="bar"><div class="bar-fill" id="ultbar" style="background:#d4a574;width:0%"></div></div><div class="bar-label">sin(x)</div>';
document.getElementById('bar-col-2').innerHTML='<div class="bar"><div class="bar-fill" id="aihpbar" style="background:#888;width:100%"></div></div><div class="bar-label">对手 生命</div><div class="bar"><div class="bar-fill" id="aixpbar" style="background:#555;width:0%"></div></div><div class="bar-label">对手 经验</div><div class="bar"><div class="bar-fill" id="aibowbar" style="background:#555;width:0%"></div></div><div class="bar-label">对手 y=kx</div><div class="bar"><div class="bar-fill" id="aiultbar" style="background:#d4a574;width:0%"></div></div><div class="bar-label">对手 sin(x)</div>';

window.addEventListener('beforeunload',()=>{if(peer){try{peer.destroy();}catch(e){}}});
requestAnimationFrame(loop);
</script>
