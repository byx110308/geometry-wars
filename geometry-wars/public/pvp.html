<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几何战争 - 联机对战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #000; font-family: 'Segoe UI', sans-serif;
  }
  #wrap { position: relative; }
  canvas { display: block; border: 1px solid #1a1a3a; border-radius: 4px; }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.88);
    z-index: 10; flex-direction: column; gap: 18px;
    color: #fff;
  }
  #overlay h2 { font-size: 22px; letter-spacing: 4px; color: #0ff; margin-bottom: 5px; }
  #overlay .section {
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; padding: 16px 20px;
    width: 300px; text-align: center;
    background: rgba(10,20,40,0.5);
  }
  #overlay .section h3 { font-size: 13px; color: #0ff; letter-spacing: 3px; margin-bottom: 12px; }
  #overlay input {
    padding: 8px 12px; background: rgba(0,0,0,0.5); border: 1px solid #333;
    color: #fff; border-radius: 4px; font-size: 16px; letter-spacing: 4px;
    width: 120px; text-align: center; text-transform: uppercase;
  }
  #overlay input:focus { border-color: #0ff; outline: none; }
  #overlay button {
    padding: 8px 24px; border: 2px solid #0ff;
    background: transparent; color: #0ff; font-size: 14px;
    letter-spacing: 3px; cursor: pointer; border-radius: 4px;
    transition: all 0.3s; margin: 4px;
  }
  #overlay button:hover { background: rgba(0,255,255,0.15); box-shadow: 0 0 15px #0ff; }
  #overlay .code { color: #ff0; font-size: 32px; letter-spacing: 6px; font-weight: bold; }
  #overlay .hint { color: #666; font-size: 11px; }
  #roomList { max-height: 120px; overflow-y: auto; width: 100%; }
  #roomList .room-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 13px;
  }
  #roomList .room-item span { color: #0ff; font-weight: bold; letter-spacing: 3px; }
  #roomList .room-item button { padding: 3px 12px; font-size: 11px; }
  #overlay .back-btn { border-color: #555; color: #555; margin-top: 10px; }
  #overlay .back-btn:hover { border-color: #f0f; color: #f0f; box-shadow: 0 0 10px #f0f; }
  #hud {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 60px; color: #fff; font-size: 13px; letter-spacing: 2px;
    pointer-events: none; text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  #hud .val { color: #0ff; font-weight: bold; font-size: 18px; }
  #msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #fff; font-size: 18px; letter-spacing: 3px; text-align: center;
    pointer-events: none; text-shadow: 0 0 20px #f0f; display: none;
  }
  .bar-wrap {
    position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 30px;
  }
  .bar-col { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .bar { width: 130px; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.1s; }
  .bar-label { color: #888; font-size: 9px; text-align: center; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay">
    <h2>联 机 对 战</h2>

    <div class="section">
      <h3>快速匹配</h3>
      <button onclick="quickMatch()">⚔ 随机匹配对手</button>
      <div class="hint" id="quickStatus"></div>
    </div>

    <div class="section">
      <h3>创建房间</h3>
      <button onclick="createRoom()">🏠 创建新房间</button>
      <div id="createResult"></div>
    </div>

    <div class="section">
      <h3>加入房间</h3>
      <input type="text" id="joinCode" placeholder="房间号" maxlength="4" autocomplete="off">
      <br>
      <button onclick="joinRoom()">🚪 加入</button>
      <div class="hint" id="joinError"></div>
    </div>

    <div class="section">
      <h3>可用房间</h3>
      <div id="roomList"><div class="hint">加载中...</div></div>
      <button onclick="refreshRooms()" style="border-color:#555;color:#555;font-size:11px;">刷新</button>
    </div>

    <button class="back-btn" onclick="window.location.href='/'">← 返回主页</button>
  </div>
  <div id="hud">
    <div id="p1name">玩家1 <span class="val" id="p1s">0</span></div>
    <div id="p2name">玩家2 <span class="val" id="p2s" style="color:#f0f">0</span></div>
  </div>
  <div id="msg"></div>
  <div id="result" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:20;flex-direction:column;align-items:center;justify-content:center;gap:20px;">
    <div id="resultTitle" style="font-size:36px;font-weight:bold;letter-spacing:6px;"></div>
    <div id="resultStats" style="color:#aaa;font-size:14px;letter-spacing:2px;text-align:center;line-height:2;"></div>
    <div style="display:flex;gap:15px;">
      <button onclick="location.reload()" style="padding:12px 30px;border:2px solid #0ff;background:transparent;color:#0ff;font-size:15px;letter-spacing:3px;cursor:pointer;border-radius:6px;">再来一局</button>
      <button onclick="window.location.href='/'" style="padding:12px 30px;border:2px solid #f0f;background:transparent;color:#f0f;font-size:15px;letter-spacing:3px;cursor:pointer;border-radius:6px;">返回主页 [ESC]</button>
    </div>
  </div>
  <div class="bar-wrap">
    <div class="bar-col">
      <div class="bar"><div class="bar-fill" id="hp1" style="background:#0ff;width:100%"></div></div>
      <div class="bar-label">P1 生命</div>
      <div class="bar"><div class="bar-fill" id="xp1" style="background:#4af;width:0%"></div></div>
      <div class="bar-label" id="xp1label">经验 0/50</div>
      <div class="bar"><div class="bar-fill" id="bow1" style="background:#0f8;width:0%"></div></div>
      <div class="bar-label" id="bow1label">弓箭</div>
      <div class="bar"><div class="bar-fill" id="ult1" style="background:#fa0;width:0%"></div></div>
      <div class="bar-label" id="ult1label">大招</div>
    </div>
    <div class="bar-col">
      <div class="bar"><div class="bar-fill" id="hp2" style="background:#f0f;width:100%"></div></div>
      <div class="bar-label">P2 生命</div>
      <div class="bar"><div class="bar-fill" id="xp2" style="background:#a4f;width:0%"></div></div>
      <div class="bar-label" id="xp2label">经验 0/50</div>
      <div class="bar"><div class="bar-fill" id="bow2" style="background:#f8f;width:0%"></div></div>
      <div class="bar-label" id="bow2label">弓箭</div>
      <div class="bar"><div class="bar-fill" id="ult2" style="background:#fa0;width:0%"></div></div>
      <div class="bar-label" id="ult2label">大招</div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const W = 900, H = 600;
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = W; c.height = H;

let myNumber = 0, opponentNumber = 0, gameReady = false, gameRunning = false;
let myPlayer, opponent;
let myBullets = [], opponentBullets = [], particles = [];
let mouseX = W/2, mouseY = H/2, mouseLeftDown = false, mouseRightDown = false;
let killCam = null;
let gameOver = false;

const GRID = 48;
let gridOX = 0, gridOY = 0;

const defaultConfig = {
  playerHp: 1000, maxXp: 50, bowChargeTime: 0.5, ultChargeTime: 1.2,
  ultMaxAimTime: 0.6, ultLockTime: 0.4, bowDamageMin: 5, bowDamageMax: 27,
  lifestealRatio: 0.1, xpPerDamage: 0.5, playerSpeed: 360, arrowCd: 0.18, ultCd: 7
};
let cfg = { ...defaultConfig };

function createPlayer(x, color) {
  return {
    x, y: H / 2, r: 16,
    hp: cfg.playerHp, maxHp: cfg.playerHp,
    xp: 0, maxXp: cfg.maxXp,
    score: 0,
    vx: 0, vy: 0,
    aimAngle: x > W/2 ? Math.PI : 0,
    bowCharge: 0, bowCharging: false, arrowCd: 0,
    dead: false,
    ultiCharging: false, ultiChargeProgress: 0, ultiCooldown: 0,
    ultiMaxTimer: 0, ultiLockTimer: 0, ultiLocked: false,
    ultiBeam: null, color
  };
}

myPlayer = createPlayer(200, '#0ff');
opponent = createPlayer(700, '#f0f');

function resetPlayers() {
  myPlayer = createPlayer(myNumber === 1 ? 200 : 700, myNumber === 1 ? '#0ff' : '#f0f');
  opponent = createPlayer(myNumber === 1 ? 700 : 200, myNumber === 1 ? '#f0f' : '#0ff');
  myBullets = []; opponentBullets = []; particles = [];
  killCam = null; gameOver = false;
  document.getElementById('msg').style.display = 'none';
}

function spawnExplosion(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 60 + Math.random() * 200;
    particles.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: 0.25 + Math.random() * 0.5, maxLife: 0.25 + Math.random() * 0.5,
      color: 'rgb(' + (color === '#0ff' ? '0,255,255' : '255,0,255') + ')',
      size: 1 + Math.random() * 3
    });
  }
}

function fireBullet(shooter, bulletsArr, color, charge) {
  const c = charge || 0;
  const speed = c > 0 ? 300 + c * 450 : 480;
  bulletsArr.push({
    x: shooter.x + Math.cos(shooter.aimAngle) * (shooter.r + 4),
    y: shooter.y + Math.sin(shooter.aimAngle) * (shooter.r + 4),
    vx: Math.cos(shooter.aimAngle) * speed,
    vy: Math.sin(shooter.aimAngle) * speed,
    color, life: 2, charge: c
  });
}

function getBeamEnd(x, y, a) {
  const dx = Math.cos(a), dy = Math.sin(a);
  let t = Infinity;
  if (dx > 0.0001) t = Math.min(t, (W - x) / dx);
  else if (dx < -0.0001) t = Math.min(t, -x / dx);
  if (dy > 0.0001) t = Math.min(t, (H - y) / dy);
  else if (dy < -0.0001) t = Math.min(t, -y / dy);
  return { x: x + dx * Math.max(1, t), y: y + dy * Math.max(1, t) };
}

function ptSegDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  if (l2 < 0.0001) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function fireUlt(shooter, chargeLevel) {
  const cl = Math.max(0.25, Math.min(1, chargeLevel));
  const end = getBeamEnd(shooter.x, shooter.y, shooter.aimAngle);
  const dmg = cl >= 1 ? 999 : Math.floor(cl * 85 + 10);
  shooter.ultiBeam = {
    x1: shooter.x, y1: shooter.y, x2: end.x, y2: end.y,
    timer: 0.15 + cl * 0.25, maxTimer: 0.15 + cl * 0.25,
    chargeLevel: cl, color: shooter.color
  };
  shooter.ultiCooldown = cl >= 1 ? cfg.ultCd : 4;
  shooter.ultiChargeProgress = 0; shooter.ultiCharging = false;
  shooter.ultiMaxTimer = 0; shooter.ultiLockTimer = 0; shooter.ultiLocked = false;

  const target = (shooter === myPlayer) ? opponent : myPlayer;
  if (!target.dead) {
    const hr = 8 + cl * 18;
    if (ptSegDist(target.x, target.y, shooter.x, shooter.y, end.x, end.y) < target.r + hr) {
      target.hp -= dmg;
      shooter.hp = Math.min(shooter.maxHp, shooter.hp + Math.ceil(dmg * cfg.lifestealRatio));
      if (target.hp <= 0) { target.hp = 0; target.dead = true; startKillCam(shooter === myPlayer ? 'me' : 'opp', target.x, target.y); }
    }
  }
  for (let i = 0; i < 8 + cl * 20; i++) {
    const pct = Math.random();
    spawnExplosion(shooter.x + (end.x - shooter.x) * pct, shooter.y + (end.y - shooter.y) * pct, shooter.color, 2);
  }
  if (shooter === myPlayer) {
    socket.emit('gameEvent', { type: 'fireUlt', chargeLevel: cl, x: myPlayer.x, y: myPlayer.y, aimAngle: myPlayer.aimAngle });
  }
}

function startKillCam(winner, px, py) {
  if (killCam) return;
  killCam = { active: true, timer: 1.8, maxTimer: 1.8, winner, posX: px, posY: py, shakeX: 0, shakeY: 0, flashAlpha: 0.8 };
  for (let i = 0; i < 80; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 80 + Math.random() * 350;
    particles.push({
      x: px, y: py, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: 0.5 + Math.random() * 1.2, maxLife: 0.5 + Math.random() * 1.2,
      color: winner === 'me' ? 'rgb(0,255,255)' : 'rgb(255,0,255)',
      size: 2 + Math.random() * 6
    });
  }
}

function updatePlayer(p, dt, isMine) {
  if (p.dead || gameOver || (killCam && killCam.active)) return;

  if (p.ultiCooldown > 0) { p.ultiCooldown -= dt; if (p.ultiCooldown <= 0) p.ultiCooldown = 0; }

  if (isMine) {
    const canUlt = p.ultiCooldown <= 0 && p.xp >= p.maxXp;
    if (mouseRightDown && canUlt) {
      if (!p.ultiCharging) { p.ultiCharging = true; p.ultiChargeProgress = 0; p.ultiMaxTimer = 0; p.ultiLockTimer = 0; p.ultiLocked = false; }
      p.ultiChargeProgress = Math.min(1, p.ultiChargeProgress + dt / cfg.ultChargeTime);
      if (p.ultiChargeProgress >= 1) {
        p.ultiMaxTimer += dt;
        const target = opponent;
        const angleToT = Math.atan2(target.y - p.y, target.x - p.x);
        let aDiff = Math.abs(p.aimAngle - angleToT);
        while (aDiff > Math.PI) aDiff = Math.PI * 2 - aDiff;
        if (aDiff < 0.22 && Math.hypot(p.x - target.x, p.y - target.y) < 600 && !target.dead) {
          p.ultiLockTimer += dt;
          if (p.ultiLockTimer >= cfg.ultLockTime) p.ultiLocked = true;
        } else {
          p.ultiLockTimer = Math.max(0, p.ultiLockTimer - dt * 2);
          if (p.ultiLockTimer < cfg.ultLockTime * 0.5) p.ultiLocked = false;
        }
        if (p.ultiMaxTimer >= cfg.ultMaxAimTime || p.ultiLocked) {
          fireUlt(p, 1); p.xp = 0;
        }
      }
    } else if (p.ultiCharging) {
      if (p.ultiChargeProgress >= 0.25) { fireUlt(p, p.ultiChargeProgress); p.xp = 0; }
      p.ultiCharging = false; p.ultiChargeProgress = 0; p.ultiMaxTimer = 0; p.ultiLockTimer = 0; p.ultiLocked = false;
    }

    if (p.arrowCd > 0) { p.arrowCd -= dt; if (p.arrowCd <= 0) p.arrowCd = 0; }
    if (mouseLeftDown && p.arrowCd <= 0 && !p.ultiCharging) {
      if (!p.bowCharging) { p.bowCharging = true; p.bowCharge = 0; }
      p.bowCharge = Math.min(1, p.bowCharge + dt / cfg.bowChargeTime);
    } else if (p.bowCharging) {
      if (p.bowCharge >= 0.2) { fireBullet(p, myBullets, p.color, p.bowCharge); p.arrowCd = cfg.arrowCd; }
      p.bowCharge = 0; p.bowCharging = false;
    }
  }

  const speedMul = (p.ultiCharging ? 0.35 : 1) * (p.bowCharging ? 0.6 : 1);
  p.vx *= Math.pow(0.02, dt);
  p.vy *= Math.pow(0.02, dt);
  p.x += p.vx * dt; p.y += p.vy * dt;
  p.x = Math.max(p.r, Math.min(W - p.r, p.x));
  p.y = Math.max(p.r, Math.min(H - p.r, p.y));
}

function update(dt) {
  if (gameOver) return;
  updatePlayer(myPlayer, dt, true);
  updatePlayer(opponent, dt, false);

  for (const arr of [myBullets, opponentBullets]) {
    for (let i = arr.length - 1; i >= 0; i--) {
      const b = arr[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20 || b.life <= 0) arr.splice(i, 1);
    }
  }

  for (let bi = myBullets.length - 1; bi >= 0; bi--) {
    const b = myBullets[bi];
    if (!opponent.dead && Math.hypot(b.x - opponent.x, b.y - opponent.y) < opponent.r + 5) {
      const dmg = b.charge > 0 ? cfg.bowDamageMin + Math.floor(b.charge * (cfg.bowDamageMax - cfg.bowDamageMin)) : 15;
      opponent.hp -= dmg;
      myPlayer.hp = Math.min(myPlayer.maxHp, myPlayer.hp + Math.ceil(dmg * cfg.lifestealRatio));
      myPlayer.xp = Math.min(myPlayer.maxXp, myPlayer.xp + Math.ceil(dmg * cfg.xpPerDamage));
      myPlayer.score += dmg;
      myBullets.splice(bi, 1);
      spawnExplosion(b.x, b.y, opponent.color, 5);
      if (opponent.hp <= 0 && !(killCam && killCam.active)) { opponent.hp = 0; opponent.dead = true; startKillCam('me', opponent.x, opponent.y); }
    }
  }
  for (let bi = opponentBullets.length - 1; bi >= 0; bi--) {
    const b = opponentBullets[bi];
    if (!myPlayer.dead && Math.hypot(b.x - myPlayer.x, b.y - myPlayer.y) < myPlayer.r + 5) {
      const dmg = b.charge > 0 ? cfg.bowDamageMin + Math.floor(b.charge * (cfg.bowDamageMax - cfg.bowDamageMin)) : 15;
      myPlayer.hp -= dmg;
      opponent.hp = Math.min(opponent.maxHp, opponent.hp + Math.ceil(dmg * cfg.lifestealRatio));
      opponent.xp = Math.min(opponent.maxXp, opponent.xp + Math.ceil(dmg * cfg.xpPerDamage));
      opponent.score += dmg;
      opponentBullets.splice(bi, 1);
      spawnExplosion(b.x, b.y, myPlayer.color, 5);
      if (myPlayer.hp <= 0 && !(killCam && killCam.active)) { myPlayer.hp = 0; myPlayer.dead = true; startKillCam('opp', myPlayer.x, myPlayer.y); }
    }
  }

  for (const p of [myPlayer, opponent]) {
    if (p.ultiBeam) { p.ultiBeam.timer -= dt; if (p.ultiBeam.timer <= 0) p.ultiBeam = null; }
  }

  if (killCam && killCam.active) {
    killCam.timer -= dt;
    const inten = killCam.timer / killCam.maxTimer;
    killCam.shakeX = (Math.random() - 0.5) * inten * 40;
    killCam.shakeY = (Math.random() - 0.5) * inten * 40;
    killCam.flashAlpha = Math.max(0, inten * 0.6 - 0.2);
    if (killCam.timer <= 0) { killCam.active = false; gameOver = true; showResult(); }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    p.vx *= 0.94; p.vy *= 0.94;
    if (p.life <= 0) particles.splice(i, 1);
  }

  updateHUD();
}

function updateHUD() {
  const p = myPlayer, o = opponent;
  document.getElementById('hp1').style.width = (p.hp / p.maxHp * 100) + '%';
  document.getElementById('hp2').style.width = (o.hp / o.maxHp * 100) + '%';
  document.getElementById('xp1').style.width = (p.xp / p.maxXp * 100) + '%';
  document.getElementById('xp2').style.width = (o.xp / o.maxXp * 100) + '%';
  document.getElementById('xp1label').textContent = '经验 ' + p.xp + '/' + p.maxXp;
  document.getElementById('xp2label').textContent = '经验 ' + o.xp + '/' + o.maxXp;
  document.getElementById('p1s').textContent = p.score;
  document.getElementById('p2s').textContent = o.score;
}

let reportedResult = false;
function showResult() {
  if (reportedResult) return;
  reportedResult = true;

  const won = !myPlayer.dead && opponent.dead;
  const draw = myPlayer.dead && opponent.dead;

  const resultDiv = document.getElementById('result');
  const resultTitle = document.getElementById('resultTitle');
  const resultStats = document.getElementById('resultStats');

  if (draw) {
    resultTitle.textContent = '平 局';
    resultTitle.style.color = '#ff0';
    resultTitle.style.textShadow = '0 0 30px #ff0';
  } else if (won) {
    resultTitle.textContent = '胜 利';
    resultTitle.style.color = '#0ff';
    resultTitle.style.textShadow = '0 0 30px #0ff';
  } else {
    resultTitle.textContent = '失 败';
    resultTitle.style.color = '#f44';
    resultTitle.style.textShadow = '0 0 30px #f44';
  }
  resultStats.innerHTML = `
    你的得分: ${myPlayer.score}<br>
    对手得分: ${opponent.score}<br>
    剩余血量: ${myPlayer.hp}
  `;
  resultDiv.style.display = 'flex';

  const userId = localStorage.getItem('gw_userId');
  const token = localStorage.getItem('gw_token');
  if (userId && token && won !== undefined) {
    const stats = JSON.parse(localStorage.getItem('gw_stats') || '{}');
    stats.matches = (stats.matches || 0) + 1;
    if (won) stats.wins = (stats.wins || 0) + 1;
    else stats.losses = (stats.losses || 0) + 1;
    localStorage.setItem('gw_stats', JSON.stringify(stats));
    fetch('/api/matchResult', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, token, won, mode: 'pvp' })
    }).catch(() => {});
  }
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(20,30,60,0.5)'; ctx.lineWidth = 1;
  for (let x = gridOX; x < W; x += GRID) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = gridOY; y < H; y += GRID) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  ctx.save();
  if (killCam && killCam.active) {
    const i = killCam.timer / killCam.maxTimer;
    ctx.translate(W/2, H/2); ctx.scale(1 + i * 0.15, 1 + i * 0.15);
    ctx.translate(-W/2 + killCam.shakeX, -H/2 + killCam.shakeY);
  }

  for (const p of particles) {
    const a = p.life / p.maxLife;
    ctx.fillStyle = p.color.replace(')', ',' + a + ')');
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2); ctx.fill();
  }

  function drawArrows(arr, color) {
    for (const b of arr) {
      if (b.charge > 0) {
        const len = 12 + b.charge * 20;
        const ang = Math.atan2(b.vy, b.vx);
        ctx.strokeStyle = color; ctx.lineWidth = 2 + b.charge * 2;
        ctx.shadowColor = color; ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(b.x - Math.cos(ang) * len * 0.5, b.y - Math.sin(ang) * len * 0.5);
        ctx.lineTo(b.x + Math.cos(ang) * len * 0.5, b.y + Math.sin(ang) * len * 0.5);
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(b.x + Math.cos(ang) * len * 0.5, b.y + Math.sin(ang) * len * 0.5);
        ctx.lineTo(b.x + Math.cos(ang + 2.6) * len * 0.25, b.y + Math.sin(ang + 2.6) * len * 0.25);
        ctx.lineTo(b.x + Math.cos(ang - 2.6) * len * 0.25, b.y + Math.sin(ang - 2.6) * len * 0.25);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      }
    }
  }
  drawArrows(myBullets, '#0ff');
  drawArrows(opponentBullets, '#f0f');

  function drawUltBeam(beam) {
    if (!beam || beam.timer <= 0) return;
    const a = beam.timer / beam.maxTimer;
    const cl = beam.chargeLevel || 0.5;
    const [r, g, b] = beam.color === '#0ff' ? [0, 255, 255] : [255, 0, 255];
    const layers = [
      { w: 36 + cl * 20, am: 0.15 }, { w: 26 + cl * 16, am: 0.35 },
      { w: 16 + cl * 12, am: 0.6 }, { w: 8 + cl * 8, am: 0.85 }, { w: 3 + cl * 4, am: 1 }
    ];
    for (const l of layers) {
      ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (a * l.am) + ')';
      ctx.lineWidth = l.w; ctx.shadowColor = 'rgba(' + r + ',' + g + ',' + b + ',' + (a * l.am * 0.7) + ')';
      ctx.shadowBlur = l.w * 2;
      ctx.beginPath(); ctx.moveTo(beam.x1, beam.y1); ctx.lineTo(beam.x2, beam.y2); ctx.stroke();
      ctx.shadowBlur = 0;
    }
    if (cl > 0.6) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (a * cl) + ')'; ctx.lineWidth = 2 + cl * 3;
      ctx.beginPath(); ctx.moveTo(beam.x1, beam.y1); ctx.lineTo(beam.x2, beam.y2); ctx.stroke();
    }
  }
  if (myPlayer.ultiBeam) drawUltBeam(myPlayer.ultiBeam);
  if (opponent.ultiBeam) drawUltBeam(opponent.ultiBeam);

  function drawSquare(p) {
    if (p.dead) return;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.aimAngle + Math.PI / 4);
    const glowR = p.r * 3 * (p.ultiCharging ? 1 + p.ultiChargeProgress * 1.8 : 1);
    const grad = ctx.createRadialGradient(0, 0, p.r * 0.3, 0, 0, glowR);
    grad.addColorStop(0, p.color.replace('#', '').match(/.{2}/g).map(h => parseInt(h, 16)).join(','));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, glowR, 0, Math.PI * 2); ctx.fill();

    if (p.ultiCharging) {
      const chargeR = p.r + 8 + p.ultiChargeProgress * 14;
      ctx.strokeStyle = 'rgba(255,200,30,' + (0.4 + p.ultiChargeProgress * 0.6) + ')';
      ctx.lineWidth = 3 + p.ultiChargeProgress * 5;
      ctx.shadowColor = 'rgba(255,200,30,0.5)'; ctx.shadowBlur = 15 + p.ultiChargeProgress * 20;
      ctx.beginPath();
      ctx.arc(0, 0, chargeR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p.ultiChargeProgress);
      ctx.stroke(); ctx.shadowBlur = 0;
    }
    if (p.bowCharging) {
      const bowR = p.r + 6;
      ctx.strokeStyle = 'rgba(' + (p.color === '#0ff' ? '0,255,255' : '255,0,255') + ',' + (0.3 + p.bowCharge * 0.7) + ')';
      ctx.lineWidth = 2 + p.bowCharge * 3;
      ctx.beginPath(); ctx.arc(0, 0, bowR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p.bowCharge); ctx.stroke();
    }
    ctx.fillStyle = p.color; const hs = p.r * 0.85;
    ctx.beginPath(); ctx.rect(-hs, -hs, hs * 2, hs * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(-p.r * 0.15, -p.r * 0.15, p.r * 0.3, p.r * 0.3);
    ctx.restore();
  }
  drawSquare(myPlayer);
  drawSquare(opponent);

  ctx.fillStyle = myPlayer.color; ctx.font = '11px monospace'; ctx.textAlign = 'center';
  if (!myPlayer.dead) ctx.fillText(myNumber === 1 ? '你' : '对手', myPlayer.x, myPlayer.y - 28);
  ctx.fillStyle = opponent.color;
  if (!opponent.dead) ctx.fillText(myNumber === 1 ? '对手' : '你', opponent.x, opponent.y - 28);

  if (!myPlayer.dead && !gameOver && !(killCam && killCam.active)) {
    const aimEnd = getBeamEnd(myPlayer.x, myPlayer.y, myPlayer.aimAngle);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 0.7; ctx.setLineDash([8, 12]);
    ctx.beginPath();
    ctx.moveTo(myPlayer.x + Math.cos(myPlayer.aimAngle) * (myPlayer.r + 6), myPlayer.y + Math.sin(myPlayer.aimAngle) * (myPlayer.r + 6));
    ctx.lineTo(aimEnd.x, aimEnd.y); ctx.stroke(); ctx.setLineDash([]);

    const cs = 10;
    ctx.strokeStyle = myPlayer.ultiLocked ? 'rgba(255,80,80,0.9)' : 'rgba(255,255,255,0.25)';
    ctx.lineWidth = myPlayer.ultiLocked ? 3 : 1.5;
    ctx.shadowColor = myPlayer.ultiLocked ? 'rgba(255,80,80,0.5)' : 'rgba(255,255,255,0.12)';
    ctx.shadowBlur = myPlayer.ultiLocked ? 20 : 6;
    ctx.beginPath(); ctx.arc(mouseX, mouseY, 10, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mouseX - cs, mouseY); ctx.lineTo(mouseX - 4, mouseY);
    ctx.moveTo(mouseX + 4, mouseY); ctx.lineTo(mouseX + cs, mouseY);
    ctx.moveTo(mouseX, mouseY - cs); ctx.lineTo(mouseX, mouseY - 4);
    ctx.moveTo(mouseX, mouseY + 4); ctx.lineTo(mouseX, mouseY + cs); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.restore();

  if (killCam && killCam.active) {
    ctx.fillStyle = 'rgba(255,255,255,' + (killCam.flashAlpha * killCam.timer / killCam.maxTimer) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font = '10px monospace'; ctx.textAlign = 'left';
  ctx.fillText('左键蓄力弓 | 右键大招(需经验) | WASD移动', 10, H - 10);
}

const keys = {};
document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === 'Escape') window.location.href = '/'; });
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
c.addEventListener('mousemove', e => {
  const rect = c.getBoundingClientRect();
  mouseX = e.clientX - rect.left; mouseY = e.clientY - rect.top;
  myPlayer.aimAngle = Math.atan2(mouseY - myPlayer.y, mouseX - myPlayer.x);
});
c.addEventListener('mousedown', e => {
  if (e.button === 0) mouseLeftDown = true;
  if (e.button === 2) { mouseRightDown = true; e.preventDefault(); }
});
c.addEventListener('mouseup', e => {
  if (e.button === 0) mouseLeftDown = false;
  if (e.button === 2) { mouseRightDown = false; e.preventDefault(); }
});
c.addEventListener('contextmenu', e => e.preventDefault());

let lastTime = 0, acc = 0;
const FIXED = 1 / 60;
function loop(time) {
  let dt = (time - lastTime) / 1000;
  lastTime = time;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  while (acc >= FIXED) { update(FIXED); acc -= FIXED; }

  if (gameRunning) {
    socket.emit('gameInput', {
      x: myPlayer.x, y: myPlayer.y, vx: myPlayer.vx, vy: myPlayer.vy,
      aimAngle: myPlayer.aimAngle, bowCharging: myPlayer.bowCharging,
      bowCharge: myPlayer.bowCharge, ultiCharging: myPlayer.ultiCharging,
      ultiChargeProgress: myPlayer.ultiChargeProgress,
    });
  }
  draw();
  requestAnimationFrame(loop);
}

socket.on('matchFound', (data) => {
  cfg = { ...defaultConfig, ...(data.config || {}) };
  resetPlayers();
  myNumber = data.players.find(p => p.id === socket.id).number;
  opponentNumber = myNumber === 1 ? 2 : 1;
  document.getElementById('p1name').innerHTML = (myNumber === 1 ? '你' : '对手') + ' <span class="val" id="p1s" style="color:' + (myNumber === 1 ? '#0ff' : '#f0f') + '">0</span>';
  document.getElementById('p2name').innerHTML = (myNumber === 2 ? '你' : '对手') + ' <span class="val" id="p2s" style="color:' + (myNumber === 2 ? '#0ff' : '#f0f') + '">0</span>';
  document.getElementById('overlay').innerHTML = '<h2 style="color:#0ff">对手已找到！</h2><button onclick="readyUp()">准备就绪</button><div class="hint">房间: ' + data.roomId + '</div>';
});

socket.on('waiting', (data) => {
  document.getElementById('quickStatus').textContent = '等待对手中... (房间: ' + data.roomId + ')';
});

socket.on('roomCreated', (data) => {
  myNumber = 1;
  document.getElementById('createResult').innerHTML = '<div class="code">' + data.code + '</div><div class="hint">分享此房间号给好友加入</div>';
  document.getElementById('quickStatus').textContent = '等待对手加入... (房间: ' + data.code + ')';
  socket.roomId = data.code;
  socket.playerNumber = 1;
});

socket.on('joinError', (data) => {
  document.getElementById('joinError').textContent = data.error;
});

socket.on('roomList', (list) => {
  renderRoomList(list);
});

socket.on('roomListUpdate', (list) => {
  renderRoomList(list);
});

function readyUp() {
  socket.emit('playerReady');
  document.getElementById('overlayText').textContent = '等待对手准备...';
  document.getElementById('readyBtn').style.display = 'none';
}

socket.on('gameStart', (data) => {
  cfg = { ...defaultConfig, ...(data.config || {}) };
  resetPlayers();
  document.getElementById('overlay').style.display = 'none';
  gameRunning = true;
});

socket.on('opponentInput', (data) => {
  if (data.playerNumber !== myNumber) {
    opponent.x = data.x;
    opponent.y = data.y;
    opponent.vx = data.vx;
    opponent.vy = data.vy;
    opponent.aimAngle = data.aimAngle;
    opponent.bowCharging = data.bowCharging;
    opponent.bowCharge = data.bowCharge;
    opponent.ultiCharging = data.ultiCharging;
    opponent.ultiChargeProgress = data.ultiChargeProgress;
  }
});

socket.on('opponentEvent', (data) => {
  if (data.playerNumber !== myNumber && data.type === 'fireUlt') {
    opponent.aimAngle = data.aimAngle;
    opponent.x = data.x; opponent.y = data.y;
    fireUlt(opponent, data.chargeLevel);
  }
});

socket.on('opponentLeft', () => {
  gameRunning = false; gameOver = true;
  document.getElementById('msg').textContent = '对手已离开';
  document.getElementById('msg').style.display = 'block';
});

socket.on('configUpdate', (newCfg) => {
  cfg = { ...defaultConfig, ...newCfg };
});

function quickMatch() {
  document.getElementById('quickStatus').textContent = '正在搜索...';
  socket.emit('findMatch');
}

function createRoom() {
  document.getElementById('createResult').innerHTML = '<div class="hint">创建中...</div>';
  socket.emit('createRoom');
}

function joinRoom() {
  const code = document.getElementById('joinCode').value.trim();
  if (!code) { document.getElementById('joinError').textContent = '请输入房间号'; return; }
  document.getElementById('joinError').textContent = '加入中...';
  socket.emit('joinRoom', code);
}

function refreshRooms() {
  socket.emit('listRooms');
}

function renderRoomList(list) {
  const el = document.getElementById('roomList');
  if (list.length === 0) {
    el.innerHTML = '<div class="hint">暂无可用房间</div>';
    return;
  }
  el.innerHTML = list.map(r =>
    '<div class="room-item"><span>' + r.code + '</span> ' + r.players + '/2人 <button onclick="document.getElementById(\'joinCode\').value=\'' + r.code + '\';joinRoom()">加入</button></div>'
  ).join('');
}

refreshRooms();
setInterval(refreshRooms, 8000);
requestAnimationFrame(loop);
</script>
</body>
</html>
