<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几何决斗</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0f' rx='4'/><line x1='8' y1='8' x2='24' y2='24' stroke='%23d4a574' stroke-width='2' stroke-linecap='round'/><line x1='24' y1='8' x2='8' y2='24' stroke='%23999' stroke-width='2' stroke-linecap='round'/><rect x='11' y='11' width='10' height='10' fill='none' stroke='%23ddd' stroke-width='1.5'/></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; background: #0a0a0f; font-family: 'Courier New', monospace;
  overflow: hidden;
}
#wrap { position: relative; }
canvas { display: block; border: 1px solid #1a1a2a; }

/* ===== 覆盖层通用 ===== */
.overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none; z-index: 10;
}
.overlay.active { pointer-events: auto; }
.overlay.active > * { pointer-events: auto; }

/* ===== 主菜单 ===== */
#menu { background: rgba(10,10,15,0.92); }
#menu h1 {
  font-size: 48px; color: #ddd; letter-spacing: 8px; margin-bottom: 6px;
}
#menu .subtitle {
  font-size: 13px; color: #666; letter-spacing: 6px; margin-bottom: 40px;
}
.menu-btn {
  width: 260px; padding: 12px 0; margin: 6px 0;
  font-size: 14px; letter-spacing: 4px; border: 1px solid #333;
  background: transparent; color: #999; cursor: pointer;
  text-align: center; font-family: 'Courier New', monospace;
  transition: border-color 0.2s, color 0.2s;
}
.menu-btn:hover { border-color: #888; color: #ddd; }
.menu-btn.secondary { font-size: 11px; width: 180px; padding: 7px 0; color: #555; }
.menu-btn.secondary:hover { border-color: #555; color: #888; }
#user-info { color: #666; font-size: 11px; letter-spacing: 2px; margin-bottom: 28px; }
#user-info .color-dot { display: inline-block; width: 8px; height: 8px; border: 1px solid currentColor; vertical-align: middle; margin: 0 5px; }

/* ===== 注册面板 ===== */
#register { background: rgba(10,10,15,0.94); }
#register h2 { font-size: 20px; color: #ddd; letter-spacing: 6px; margin-bottom: 18px; }
#register .field { margin: 7px 0; }
#register label { display: block; color: #666; font-size: 10px; letter-spacing: 2px; margin-bottom: 4px; }
#register input[type=text], #register input[type=password] {
  width: 240px; padding: 9px; font-size: 13px; font-family: 'Courier New', monospace;
  background: rgba(255,255,255,0.03); border: 1px solid #333; color: #ddd;
  outline: none; letter-spacing: 1px;
}
#register input:focus { border-color: #888; }
.color-options { display: flex; gap: 7px; margin: 4px 0; flex-wrap: wrap; max-width: 260px; }
.color-opt {
  width: 28px; height: 28px; cursor: pointer;
  border: 2px solid #333; transition: border-color 0.15s;
}
.color-opt:hover { border-color: #888; }
.color-opt.selected { border-color: #ddd; }
#register .err { color: #c97d8a; font-size: 10px; height: 14px; margin-top: 3px; }

/* ===== 联机大厅 ===== */
#lobby { background: rgba(10,10,15,0.92); }
#lobby h2 { font-size: 20px; color: #ddd; letter-spacing: 6px; margin-bottom: 28px; }
#lobby .status-text { color: #999; font-size: 12px; letter-spacing: 2px; margin: 8px 0; min-height: 18px; }
#room-code {
  font-size: 32px; color: #d4a574; letter-spacing: 8px;
  margin: 12px 0; padding: 8px 18px;
  border: 1px dashed #444; cursor: pointer;
}
#room-code:hover { border-color: #888; }
#join-input {
  width: 100%; max-width: 320px; padding: 9px; font-size: 16px; text-align: center; letter-spacing: 2px;
  background: rgba(255,255,255,0.03); border: 1px solid #333; color: #ddd;
  outline: none; margin: 7px 0; font-family: 'Courier New', monospace;
}
#join-input:focus { border-color: #888; }

/* ===== 对战 HUD ===== */
#hud {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 70px; color: #999; font-size: 11px; letter-spacing: 3px;
  pointer-events: none; z-index: 5; font-family: 'Courier New', monospace;
}
#hud .val { color: #ddd; font-size: 16px; }
#msg-overlay {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: #ddd; font-size: 15px; letter-spacing: 4px; text-align: center;
  pointer-events: none; z-index: 5; display: none; font-family: 'Courier New', monospace;
}
.bar-wrap {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 40px; z-index: 5; pointer-events: none;
}
.bar-col { display: flex; flex-direction: column; gap: 2px; align-items: center; }
.bar { width: 140px; height: 3px; background: rgba(255,255,255,0.06); overflow: hidden; }
.bar-fill { height: 100%; transition: width 0.1s; }
.bar-label { color: #555; font-size: 8px; text-align: center; letter-spacing: 1px; font-family: 'Courier New', monospace; }

/* ===== 等待中动画 ===== */
.spinner {
  width: 18px; height: 18px; border: 2px solid #333;
  border-top-color: #888;
  animation: spin 0.8s linear infinite; margin: 8px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 历史战绩 & 房间记录 ===== */
#history .tab-row { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid #222; }
#history .tab-btn { flex: 1; padding: 8px 0; font-size: 13px; letter-spacing: 2px; color: #555; background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; }
#history .tab-btn.on { color: #d4a574; border-bottom: 2px solid #d4a574; }
#history .tab-content { max-height: 280px; overflow-y: auto; display: none; }
#history .tab-content.on { display: block; }
#history .list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #1a1a1a; font-size: 12px; letter-spacing: 1px; color: #777; }
#history .list-item .result-win { color: #9db88f; }
#history .list-item .result-lose { color: #c97d8a; }
#history .list-item .room-code-sm { color: #d4a574; letter-spacing: 3px; font-weight: bold; cursor: pointer; }
#history .list-item .room-code-sm:hover { color: #fff; }
#history .list-empty { text-align: center; padding: 40px 20px; color: #444; font-size: 13px; letter-spacing: 3px; }
#history .stat-bar { display: flex; gap: 16px; margin-bottom: 16px; }
#history .stat-item { flex: 1; text-align: center; padding: 8px; background: rgba(255,255,255,0.02); border: 1px solid #1a1a1a; }
#history .stat-num { font-size: 22px; color: #d4a574; letter-spacing: 2px; }
#history .stat-label { font-size: 10px; color: #555; letter-spacing: 1px; margin-top: 2px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <!-- 管理员面板 -->
  <div id="admin-panel" class="overlay" style="display:none;">
    <h2 style="font-size:20px;color:#ddd;letter-spacing:6px;margin-bottom:20px;">管理员验证</h2>
    <input type="password" id="admin-pw" maxlength="20" placeholder="输入管理密码..." style="width:220px;padding:10px;font-size:15px;text-align:center;letter-spacing:3px;background:rgba(255,255,255,0.03);border:1px solid #333;color:#ddd;outline:none;font-family:'Courier New',monospace;margin:8px 0;">
    <div class="err" id="admin-err" style="color:#c97d8a;font-size:10px;height:14px;margin:4px 0;"></div>
    <button class="menu-btn" onclick="adminVerify()">确认</button>
    <button class="menu-btn secondary" onclick="backToMenu()">返回</button>
  </div>

  <!-- 菜单 -->
  <div id="menu" class="overlay active">
    <h1>几何决斗</h1>
    <div class="subtitle">GEOMETRY WARS</div>
    <div id="user-info">
      <span>未注册</span>
    </div>
    <button class="menu-btn" onclick="startAI()">人机对战</button>
    <button class="menu-btn" onclick="showLobby()">联机对战</button>
    <button class="menu-btn secondary" onclick="showRegister()">注册 / 切换账号</button>
    <button class="menu-btn secondary" onclick="showHistory()">历史战绩</button>
    <button class="menu-btn secondary" onclick="showAdmin()">管理</button>
  </div>

  <!-- 注册 -->
  <div id="register" class="overlay" style="display:none;">
    <h2>注册账号</h2>
    <div class="field">
      <label>玩家名称</label>
      <input type="text" id="reg-name" maxlength="12" placeholder="输入名称...">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="reg-pass" maxlength="16" placeholder="输入密码...">
    </div>
    <div class="field">
      <label>选择颜色</label>
      <div class="color-options" id="color-options"></div>
    </div>
    <div class="err" id="reg-err"></div>
    <button class="menu-btn" onclick="doRegister()">确认</button>
    <button class="menu-btn secondary" onclick="backToMenu()">返回</button>
  </div>

  <!-- 联机大厅 -->
  <div id="lobby" class="overlay" style="display:none;">
    <h2>联机对战</h2>
    <div style="display:flex;gap:16px;">
      <div style="flex:1;min-width:0;">
        <button class="menu-btn" onclick="createRoom()">创建房间</button>
        <div class="status-text" id="lobby-status"></div>
        <div id="room-code" style="display:none;"></div>
        <input type="text" id="join-input" placeholder="输入6位房间码..." maxlength="6">
        <button class="menu-btn" onclick="joinRoom()">加入房间</button>
        <div class="spinner" id="lobby-spinner" style="display:none;"></div>
        <button class="menu-btn secondary" onclick="disconnectAndMenu()">返回</button>
      </div>
      <div style="border-left:1px solid #222;padding-left:16px;min-width:200px;">
        <div style="color:#666;font-size:10px;letter-spacing:2px;margin-bottom:8px;">活跃房间</div>
        <div id="live-rooms" style="max-height:300px;overflow-y:auto;">
          <div style="color:#444;font-size:11px;">加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 历史战绩 / 房间记录 -->
  <div id="history" class="overlay" style="display:none;">
    <h2>历史记录</h2>
    <div class="tab-row">
      <button class="tab-btn on" onclick="switchHistoryTab('record')">战绩</button>
      <button class="tab-btn" onclick="switchHistoryTab('room')">房间</button>
    </div>
    <div class="tab-content on" id="tab-record">
      <div class="stat-bar" id="stats-bar"></div>
      <div id="record-list"></div>
    </div>
    <div class="tab-content" id="tab-room">
      <div id="room-list"></div>
    </div>
    <button class="menu-btn secondary" onclick="backToMenu()" style="margin-top:16px;">返回</button>
  </div>

  <!-- HUD（对战中使用） -->
  <div id="hud" style="display:none;">
    <div><span id="p1-label">玩家</span> <span class="val" id="ps">0</span></div>
    <div id="round-indicator" style="color:#666;font-size:11px;letter-spacing:4px;">B 0 - 0</div>
    <div><span id="p2-label">对手</span> <span class="val" id="ais" style="color:#f0f">0</span></div>
  </div>
  <div id="msg-overlay"></div>
  <div class="bar-wrap" id="bar-wrap" style="display:none;">
    <div class="bar-col" id="bar-col-1"></div>
    <div class="bar-col" id="bar-col-2"></div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = c.width = 900;
const H = c.height = 600;

// ===================== 用户系统 =====================
const COLORS = [
  { name: '白', hex: '#e0e0e0', rgb: 'rgba(224,224,224,0.15)' },
  { name: '灰', hex: '#909090', rgb: 'rgba(144,144,144,0.15)' },
  { name: '橙', hex: '#d4a574', rgb: 'rgba(212,165,116,0.15)' },
  { name: '青', hex: '#7ea8b8', rgb: 'rgba(126,168,184,0.15)' },
  { name: '绿', hex: '#9db88f', rgb: 'rgba(157,184,143,0.15)' },
  { name: '赤', hex: '#c97d8a', rgb: 'rgba(201,125,138,0.15)' },
  { name: '紫', hex: '#9a9bcf', rgb: 'rgba(154,155,207,0.15)' },
  { name: '黄', hex: '#c9c090', rgb: 'rgba(201,192,144,0.15)' },
];

// ===================== 自动更新 =====================
const VERSION = 10;
// 将下方 URL 替换为你的 GitHub 仓库 raw 文件地址：
// 格式: https://raw.githubusercontent.com/用户名/仓库名/main/geometry-wars.html
const UPDATE_URL = 'https://gitee.com/byx0308/geometry-wars/raw/main/geometry-wars.html';

(function checkUpdate() {
  if (!UPDATE_URL || window.location.href.startsWith(UPDATE_URL)) return;
  try {
    fetch(UPDATE_URL + '?_=' + Date.now(), { cache: 'no-store' })
      .then(r => r.text())
      .then(html => {
        const m = html.match(/const VERSION\s*=\s*(\d+)/);
        if (m && parseInt(m[1]) > VERSION) {
          document.title = '几何决斗 - 正在更新...';
          document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#999;font-family:monospace;font-size:14px;letter-spacing:2px;">发现新版本，正在自动更新...</div>';
          setTimeout(() => { window.location.href = UPDATE_URL; }, 800);
        }
      })
      .catch(() => {}); // 网络不可达则静默跳过
  } catch(e) {}
})();

let currentUser = null; // { name, passHashed, colorIdx }

// ===================== 战绩 & 房间记录 =====================
function loadHistory() {
  try {
    return JSON.parse(localStorage.getItem('gw_history') || '{"matches":[],"rooms":[]}');
  } catch(e) { return {matches:[], rooms:[]}; }
}
function saveHistory(h) { localStorage.setItem('gw_history', JSON.stringify(h)); }

function recordMatch(mode, opponent, iWon, myScore, oppScore) {
  const h = loadHistory();
  h.matches.unshift({
    time: Date.now(),
    mode: mode,    // 'ai' | 'online'
    opponent: opponent,
    result: iWon ? 'win' : 'lose',
    myScore: myScore,
    oppScore: oppScore
  });
  if (h.matches.length > 50) h.matches.length = 50;
  saveHistory(h);
}

function recordRoom(code, role) {
  const h = loadHistory();
  h.rooms.unshift({
    time: Date.now(),
    code: code,
    role: role  // 'host' | 'guest'
  });
  // deduplicate by code
  h.rooms = h.rooms.filter((r, i, a) => a.findIndex(x => x.code === r.code) === i);
  if (h.rooms.length > 20) h.rooms.length = 20;
  saveHistory(h);
}

function loadUser() {
  const raw = localStorage.getItem('gw_user');
  if (raw) {
    try { currentUser = JSON.parse(raw); } catch (e) { currentUser = null; }
  }
  updateMenuUserInfo();
}
function saveUser() {
  if (currentUser) localStorage.setItem('gw_user', JSON.stringify(currentUser));
  updateMenuUserInfo();
}
function updateMenuUserInfo() {
  const el = document.getElementById('user-info');
  if (currentUser) {
    const c = COLORS[currentUser.colorIdx];
    el.innerHTML = '<span class="color-dot" style="background:' + c.hex + ';box-shadow:0 0 6px ' + c.hex + ';"></span>' + currentUser.name + ' <span style="color:#555">|</span> 已登录';
  } else {
    el.innerHTML = '<span>未注册</span>';
  }
}

function hashSimple(pw) {
  let h = 0;
  for (let i = 0; i < pw.length; i++) { h = ((h << 5) - h) + pw.charCodeAt(i); h |= 0; }
  return h.toString(36);
}

function showRegister() {
  hideAll();
  const menu = document.getElementById('menu');
  document.getElementById('register').classList.add('active');
  document.getElementById('register').style.display = '';
  if (currentUser) {
    document.getElementById('reg-name').value = currentUser.name;
    document.getElementById('reg-pass').value = '';
    selectedColorIdx = currentUser.colorIdx;
  } else {
    document.getElementById('reg-name').value = '';
    document.getElementById('reg-pass').value = '';
    selectedColorIdx = 0;
  }
  document.getElementById('reg-err').textContent = '';
  renderColorOptions();
}
function backToMenu() {
  clearTimeout(joinTimeout);
  stopRoomRefresh();
  hideAll();
  document.getElementById('menu').classList.add('active');
  document.getElementById('menu').style.display = '';
  // Also clean up any peer connection
  if (peer) { peer.destroy(); peer = null; conn = null; }
}
function hideAll() {
  document.querySelectorAll('.overlay').forEach(o => { o.classList.remove('active'); o.style.display = 'none'; });
  document.getElementById('hud').style.display = 'none';
  document.getElementById('bar-wrap').style.display = 'none';
  document.getElementById('msg-overlay').style.display = 'none';
  document.getElementById('room-code').style.display = 'none';
  document.getElementById('lobby-status').textContent = '';
  document.getElementById('lobby-spinner').style.display = 'none';
  gameMode = null;
  gameOver = false;
  killCam.active = false;
}

let selectedColorIdx = 0;

function renderColorOptions() {
  const container = document.getElementById('color-options');
  container.innerHTML = '';
  COLORS.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'color-opt' + (i === selectedColorIdx ? ' selected' : '');
    div.style.background = c.hex;
    div.style.color = c.hex;
    div.title = c.name;
    div.onclick = () => { selectedColorIdx = i; renderColorOptions(); };
    container.appendChild(div);
  });
}

function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const pass = document.getElementById('reg-pass').value;
  const errEl = document.getElementById('reg-err');
  if (name.length < 2) { errEl.textContent = '名称至少2个字符'; return; }
  if (pass.length < 1) { errEl.textContent = '请设置密码'; return; }
  if (pass.length > 16) { errEl.textContent = '密码最多16个字符'; return; }

  currentUser = { name, passHashed: hashSimple(pass), colorIdx: selectedColorIdx };
  saveUser();
  errEl.textContent = '';
  backToMenu();
}

// ===================== PeerJS 联机 =====================
let peer = null;
let conn = null;
let isHost = false;
let remoteReady = false;
let joinTimeout = null;
let roomRefreshTimer = null;

// ===================== 房间服务器 =====================
// 修改此地址为房间服务器地址（局域网用 IP，例如 http://192.168.1.x:8765）
const ROOM_SERVER = 'http://localhost:8765';

async function fetchRoomList() {
  try {
    const res = await fetch(ROOM_SERVER + '/rooms', { signal: AbortSignal.timeout(3000) });
    if (!res.ok) return [];
    return await res.json();
  } catch(e) { return []; }
}

async function registerRoom(code) {
  try {
    await fetch(ROOM_SERVER + '/register', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ code, name: currentUser.name, players: 1 }),
      signal: AbortSignal.timeout(3000)
    });
  } catch(e) {}
}

async function unregisterRoom(code) {
  try {
    await fetch(ROOM_SERVER + '/unregister', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ code }),
      signal: AbortSignal.timeout(3000)
    });
  } catch(e) {}
}

async function refreshRoom(code) {
  try {
    await fetch(ROOM_SERVER + '/refresh', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ code }),
      signal: AbortSignal.timeout(3000)
    });
  } catch(e) {}
}

function renderLiveRooms(rooms) {
  const el = document.getElementById('live-rooms');
  if (!rooms || !rooms.length) {
    el.innerHTML = '<div style="color:#444;font-size:11px;">暂无房间</div>';
    return;
  }
  el.innerHTML = rooms.map(r => `
    <div style="padding:6px 8px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <span class="room-code-sm" onclick="document.getElementById('join-input').value='${r.code}';document.getElementById('join-input').focus()">${r.code}</span>
        <span style="font-size:9px;color:#555;margin-left:8px;">${r.host}</span>
      </div>
      <span style="font-size:9px;color:#555;">${r.players}P</span>
    </div>
  `).join('');
}

async function startRoomRefresh() {
  const rooms = await fetchRoomList();
  renderLiveRooms(rooms);
  roomRefreshTimer = setInterval(async () => {
    const r = await fetchRoomList();
    renderLiveRooms(r);
  }, 3000);
}

function stopRoomRefresh() {
  clearInterval(roomRefreshTimer);
  roomRefreshTimer = null;
}

function initPeer(id) {
  if (peer) { peer.destroy(); }
  const peerConfig = {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
      ]
    },
    debug: 0
  };
  peer = new Peer(id, peerConfig);
  peer.on('open', (pid) => {
    console.log('Peer opened:', pid);
  });
  peer.on('error', (err) => {
    console.error('Peer error:', err);
    document.getElementById('lobby-status').textContent = '连接失败: ' + err.type;
    document.getElementById('lobby-spinner').style.display = 'none';
  });
  peer.on('disconnected', () => {
    console.log('Peer disconnected from server, reconnecting...');
    if (peer && !peer.destroyed) {
      peer.reconnect();
    }
  });
}

function showLobby() {
  if (!currentUser) { showRegister(); return; }
  hideAll();
  document.getElementById('lobby').classList.add('active');
  document.getElementById('lobby').style.display = '';
  document.getElementById('lobby-status').textContent = '';
  document.getElementById('room-code').style.display = 'none';
  document.getElementById('join-input').value = '';
  document.getElementById('lobby-spinner').style.display = 'none';
  stopRoomRefresh();
  startRoomRefresh();
}

function createRoom() {
  const roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
  initPeer(roomId);
  document.getElementById('lobby-spinner').style.display = 'block';
  document.getElementById('lobby-status').textContent = '正在创建房间...';

  peer.on('open', (pid) => {
    isHost = true;
    recordRoom(pid, 'host');
    registerRoom(pid);
    // 每60秒刷新房间存活状态
    let refreshInt = setInterval(() => refreshRoom(pid), 60000);
    document.getElementById('lobby-spinner').style.display = 'none';
    document.getElementById('lobby-status').textContent = '等待对手加入...（如无法加入请检查是否在同一网络）';
    document.getElementById('room-code').style.display = '';
    document.getElementById('room-code').textContent = pid;
    document.getElementById('room-code').title = '点击复制房间码';
    document.getElementById('room-code').onclick = () => {
      navigator.clipboard.writeText(pid).then(() => {
        document.getElementById('room-code').style.color = '#4a4';
        setTimeout(() => { document.getElementById('room-code').style.color = '#d4a574'; }, 600);
      }).catch(() => {});
    };
    peer.on('connection', (c) => {
      if (conn) { c.close(); return; }
      clearInterval(refreshInt);
      unregisterRoom(pid);
      setupConnection(c);
    });
  });
  peer.on('disconnected', () => {
    if (isHost) {
      document.getElementById('lobby-status').textContent = '连接断开，正在重连...';
    }
  });
}

function joinRoom() {
  const code = document.getElementById('join-input').value.trim();
  if (!code) { document.getElementById('lobby-status').textContent = '请输入房间码'; return; }
  initPeer();
  document.getElementById('lobby-spinner').style.display = 'block';
  document.getElementById('lobby-status').textContent = '正在加入房间...';

  peer.on('open', () => {
    isHost = false;
    const c = peer.connect(code, { reliable: true });
    setupConnection(c);
    // Connection timeout
    joinTimeout = setTimeout(() => {
      if (gameMode !== 'online') {
        document.getElementById('lobby-status').textContent = '无法加入房间（超时）';
        document.getElementById('lobby-spinner').style.display = 'none';
        if (c) { c.close(); }
        if (peer) { peer.destroy(); peer = null; }
      }
    }, 15000);
  });
  peer.on('error', (err) => {
    clearTimeout(joinTimeout);
    let msg = '连接失败: ' + err.type;
    if (err.type === 'peer-unavailable') {
      msg = '找不到该房间（请确保对方已创建房间且房间码正确）';
    } else if (err.type === 'server-error') {
      msg = '服务器繁忙，请稍后重试';
    }
    document.getElementById('lobby-status').textContent = msg;
    document.getElementById('lobby-spinner').style.display = 'none';
  });
}

function setupConnection(c) {
  conn = c;
  clearTimeout(joinTimeout);
  conn.on('open', () => {
    clearTimeout(joinTimeout);
    recordRoom(conn.peer, 'guest');
    document.getElementById('lobby-spinner').style.display = 'none';
    document.getElementById('lobby-status').textContent = '对手已连接！即将开始...';
    // Exchange user info
    conn.send(JSON.stringify({ type: 'hello', name: currentUser.name, colorIdx: currentUser.colorIdx }));
    // Host waits for guest's hello then starts, guest waits for host's start
  });

  conn.on('data', (raw) => {
    let data;
    try { data = JSON.parse(raw); } catch (e) { return; }

    if (data.type === 'hello') {
      remoteUser = { name: data.name, colorIdx: data.colorIdx };
      if (isHost) {
        // Host sends start signal with both users' info
        conn.send(JSON.stringify({
          type: 'start',
          hostUser: { name: currentUser.name, colorIdx: currentUser.colorIdx },
          guestUser: { name: data.name, colorIdx: data.colorIdx }
        }));
        startOnlineGame();
      }
    }

    if (data.type === 'start') {
      // Guest receives start signal
      remoteUser = isHost ? data.guestUser : data.hostUser;
      startOnlineGame();
    }

    if (data.type === 'state') {
      remoteState = data;
    }

    if (data.type === 'hit') {
      applyHitLocally(data);
    }

    if (data.type === 'fireBullet') {
      fireBulletRemote(data);
    }

    if (data.type === 'fireUlt') {
      fireUltRemote(data);
    }

    if (data.type === 'gameOver') {
      handleOnlineGameOver(data.winner === (isHost ? 'host' : 'guest'));
    }

    if (data.type === 'rematch') {
      resetOnlineGame();
    }
  });

  conn.on('close', () => {
    if (gameMode === 'online') {
      document.getElementById('lobby-status').textContent = '对手断开连接';
      setTimeout(() => backToMenu(), 1500);
    }
    conn = null;
  });

  conn.on('error', (err) => {
    console.error('Connection error:', err);
    document.getElementById('lobby-status').textContent = '连接错误';
  });
}

let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function snd(freq, dur, type, vol, fade) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + (fade || dur));
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}

function spawnDmg(x, y, val, color) {

}

function applyDamage(attacker, defender, dmg, hitX, hitY) {
  if (defender.invuln > 0) return false;
  defender.hp -= dmg;
  if (defender.hp < 0) defender.hp = 0;
  attacker.hp = Math.min(attacker.maxHp, attacker.hp + Math.ceil(dmg * 0.1));
  attacker.xp = Math.min(attacker.maxXp, attacker.xp + Math.ceil(dmg * 0.5));
  attacker.score += dmg;
  updateScoreDisplay();
  spawnExplosion(hitX, hitY, COLORS[defender.colorIdx].hex, 5);
  spawnDmg(hitX, hitY - 12, dmg, COLORS[attacker.colorIdx].hex);
  screenShake = Math.max(screenShake, Math.min(8, dmg * 0.4));

  // Combo
  if (Date.now() - attacker.lastHitTime < 1500) attacker.combo++;
  else attacker.combo = 1;
  attacker.lastHitTime = Date.now();

  // Sound
  snd(200 + attacker.combo * 30, 0.12, 'square', 0.06);
  if (dmg >= 80) snd(80, 0.25, 'sawtooth', 0.1);

  if (defender.hp <= 0) return true;
  return false;
}

function spawnExplosion(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 60 + Math.random() * 200;
    particles.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: 0.25 + Math.random() * 0.5, maxLife: 0.25 + Math.random() * 0.5,
      color, size: 1 + Math.random() * 3
    });
  }
}

function spawnShatter(x, y, color, r) {
  const hex = color;
  const r_ = parseInt(hex.slice(1,3), 16);
  const g_ = parseInt(hex.slice(3,5), 16);
  const b_ = parseInt(hex.slice(5,7), 16);
  const half = (r || 16) * 0.85;

  // 8 triangular shards radiating from center — fragments of the broken square
  for (let i = 0; i < 8; i++) {
    const baseAng = (i / 8) * Math.PI * 2;
    const spd = 120 + Math.random() * 250;
    // Each shard flies outward along its edge direction
    const ang = baseAng + (Math.random() - 0.5) * 0.4;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: 0.5 + Math.random() * 0.6, maxLife: 0.5 + Math.random() * 0.6,
      color, size: half,
      r: r_, g: g_, b: b_,
      rot: baseAng + Math.PI / 4,
      rotSpd: (Math.random() - 0.5) * 8,
      type: 'shatter',
      baseAng: baseAng
    });
  }
  // Small center burst
  for (let i = 0; i < 6; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 60 + Math.random() * 150;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: 0.2 + Math.random() * 0.4, maxLife: 0.2 + Math.random() * 0.4,
      color, size: 1 + Math.random() * 3,
      r: r_, g: g_, b: b_
    });
  }
}

function fireBullet(shooter, bulletsArr) {
  const angle = shooter.aimAngle;
  const charge = shooter.bowCharge;
  const startX = shooter.x + Math.cos(angle) * (shooter.r + 4);
  const startY = shooter.y + Math.sin(angle) * (shooter.r + 4);
  const end = getBeamEnd(shooter.x, shooter.y, angle);

  const ray = {
    x1: startX, y1: startY,
    x2: end.x, y2: end.y,
    color: COLORS[shooter.colorIdx].hex,
    timer: 0.07 + charge * 0.13,
    charge: charge
  };
  bulletsArr.push(ray);

  // Muzzle flash — burst at shooter
  for (let i = 0; i < 6 + charge * 10; i++) {
    const a = angle + (Math.random() - 0.5) * 0.5;
    const spd = 80 + Math.random() * 200 + charge * 200;
    particles.push({
      x: startX, y: startY,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: 0.08 + charge * 0.08, maxLife: 0.08 + charge * 0.08,
      color: COLORS[shooter.colorIdx].hex, size: 1 + Math.random() * (1 + charge * 2),
      type: 'spark'
    });
  }

  // Ray path spark particles along the line
  const rLen = Math.hypot(ray.x2 - ray.x1, ray.y2 - ray.y1);
  for (let i = 0; i < 4 + charge * 8; i++) {
    const t = Math.random();
    const sx = ray.x1 + (ray.x2 - ray.x1) * t;
    const sy = ray.y1 + (ray.y2 - ray.y1) * t;
    particles.push({
      x: sx, y: sy,
      vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60,
      life: 0.06 + charge * 0.06, maxLife: 0.06 + charge * 0.06,
      color: COLORS[shooter.colorIdx].hex, size: 0.8 + Math.random() * 1.5,
      type: 'spark'
    });
  }

  // Immediate hit detection — ray-vs-circle
  const target = (shooter === player) ? opponent : (shooter === ai ? player : null);
  if (target && !target.dead) {
    const dist = pointToSegmentDist(target.x, target.y, ray.x1, ray.y1, ray.x2, ray.y2);
    if (dist < target.r + 5) {
      const dmg = charge > 0 ? 5 + Math.floor(charge * 22) : 15;
      const killed = applyDamage(shooter, target, dmg, target.x, target.y);
      snd(900 + charge * 500, 0.06, 'square', 0.06, 0.04);
      if (gameMode === 'online' && shooter === player && conn && conn.open) {
        conn.send(JSON.stringify({ type: 'hit', damage: dmg, bulletX: target.x, bulletY: target.y }));
      }
      if (killed) {
        target.dead = true;
        startKillCam(shooter, target.x, target.y);
        spawnShatter(target.x, target.y, COLORS[target.colorIdx].hex, target.r);
        snd(120, 0.5, 'sawtooth', 0.12);
        if (gameMode === 'online' && shooter === player && conn && conn.open) {
          conn.send(JSON.stringify({ type: 'gameOver', winner: isHost ? 'host' : 'guest' }));
        }
      }
    }
  }
}

function getBeamEnd(x, y, angle) {
  const dx = Math.cos(angle);
  const dy = Math.sin(angle);
  let t = Infinity;
  if (dx > 0.0001) t = Math.min(t, (W - x) / dx);
  else if (dx < -0.0001) t = Math.min(t, -x / dx);
  if (dy > 0.0001) t = Math.min(t, (H - y) / dy);
  else if (dy < -0.0001) t = Math.min(t, -y / dy);
  return { x: x + dx * Math.max(1, t), y: y + dy * Math.max(1, t) };
}

function pointToSegmentDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  if (lenSq < 0.0001) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function fireUlt(shooter, target, chargeLevel) {
  const clampedCharge = Math.max(0.25, Math.min(1, chargeLevel));
  const end = getBeamEnd(shooter.x, shooter.y, shooter.aimAngle);
  const damage = clampedCharge >= 1.0 ? 999 : Math.floor(clampedCharge * 85 + 10);
  const beamDuration = 0.15 + clampedCharge * 0.25;

  shooter.ultiBeam = {
    x1: shooter.x, y1: shooter.y,
    x2: end.x, y2: end.y,
    timer: beamDuration, maxTimer: beamDuration,
    chargeLevel: clampedCharge,
    color: COLORS[shooter.colorIdx].hex
  };

  shooter.ultiCooldown = clampedCharge >= 1.0 ? 7 : 4;
  shooter.ultiChargeProgress = 0;
  shooter.ultiCharging = false;
  shooter.ultiMaxTimer = 0;
  shooter.ultiLockTimer = 0;
  shooter.ultiLocked = false;

  let hitDealt = 0;

  if (target && !target.dead) {
    const hitRadius = 8 + clampedCharge * 18;
    const dist = pointToSegmentDist(target.x, target.y, shooter.x, shooter.y, end.x, end.y);
    if (dist < target.r + hitRadius) {
      const killed = applyDamage(shooter, target, damage, target.x, target.y);
      spawnExplosion(target.x, target.y, '#fff', Math.floor(15 + clampedCharge * 50));
      spawnExplosion(target.x, target.y, '#ff0', Math.floor(10 + clampedCharge * 30));
      hitDealt = damage;
      snd(60, 0.6, 'sawtooth', 0.15);
      screenShake = Math.max(screenShake, 15);
      if (killed) {
        target.dead = true;
        startKillCam(shooter, target.x, target.y);
        spawnShatter(target.x, target.y, COLORS[target.colorIdx].hex, target.r);
        snd(50, 0.8, 'sawtooth', 0.18);
      }
    }
  }

  for (let i = 0; i < 8 + clampedCharge * 20; i++) {
    const pct = Math.random();
    spawnExplosion(
      shooter.x + (end.x - shooter.x) * pct,
      shooter.y + (end.y - shooter.y) * pct,
      COLORS[shooter.colorIdx].hex, 2
    );
  }

  return hitDealt;
}

function startKillCam(winner, px, py) {
  if (killCam.active) return;
  killCam.active = true;
  killCam.timer = killCam.maxTimer;
  killCam.winner = winner.isLocal ? 'player' : 'opponent';
  killCam.posX = px;
  killCam.posY = py;
  killCam.shakeX = 0;
  killCam.shakeY = 0;
  killCam.flashAlpha = 0.8;
  const pColor = COLORS[winner.colorIdx].hex;
  for (let i = 0; i < 80; i++) {

    });
  }
}

function applyHitLocally(data) {

    player.dead = true;

function switchHistoryTab(tab) {

function formatTime(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

function renderRecords() {
  const h = loadHistory();
  const stats = document.getElementById('stats-bar');
  const list = document.getElementById('record-list');
  const wins = h.matches.filter(m => m.result === 'win').length;
  const total = h.matches.length;
  stats.innerHTML = `
    <div class="stat-item"><div class="stat-num">${total}</div><div class="stat-label">总场次</div></div>
    <div class="stat-item"><div class="stat-num">${wins}</div><div class="stat-label">胜</div></div>
    <div class="stat-item"><div class="stat-num">${total - wins}</div><div class="stat-label">负</div></div>
    <div class="stat-item"><div class="stat-num">${total ? Math.round(wins / total * 100) : 0}%</div><div class="stat-label">胜率</div></div>
  `;
  if (!h.matches.length) {
    list.innerHTML = '<div class="list-empty">暂无战绩</div>';
    return;
  }
  list.innerHTML = h.matches.map(m => {
    const cls = m.result === 'win' ? 'result-win' : 'result-lose';
    const txt = m.result === 'win' ? '胜' : '负';
    const mode = m.mode === 'ai' ? '人机' : '联机';
    return `<div class="list-item">
      <span style="color:#555;">[${mode}]</span>
      <span style="color:#888;">vs ${m.opponent}</span>
      <span>${m.myScore}:${m.oppScore}</span>
      <span class="${cls}">${txt}</span>
      <span style="color:#444;font-size:10px;">${formatTime(m.time)}</span>
    </div>`;
  }).join('');
}

function renderRooms() {
  const h = loadHistory();
  const list = document.getElementById('room-list');
  if (!h.rooms.length) {
    list.innerHTML = '<div class="list-empty">暂无房间记录</div>';
    return;
  }
  list.innerHTML = h.rooms.map(r => {
    const role = r.role === 'host' ? '创建' : '加入';
    return `<div class="list-item">
      <span style="color:#555;">[${role}]</span>
      <span class="room-code-sm" onclick="copyRoomCode('${r.code}',this)">${r.code}</span>
      <span style="color:#444;font-size:10px;">${formatTime(r.time)}</span>
    </div>`;
  }).join('');
}

function copyRoomCode(code, el) {
  navigator.clipboard.writeText(code).then(() => {

    setTimeout(() => { el.style.color = '#d4a574'; }, 600);

// ===================== 更新逻辑 =====================
function updatePlayerInput(p, dt) {
  if (p.dead || matchOver || killCam.active || roundPause > 0) return;

  if (p.ultiCooldown > 0) {
    p.ultiCooldown -= dt;
    if (p.ultiCooldown <= 0) p.ultiCooldown = 0;
  }

  const target = (p === player) ? opponent : player;
  const canUlt = p.ultiCooldown <= 0 && p.xp >= p.maxXp;
  const chargeDown = (p === player) ? mouseRightDown : false;

  if (chargeDown && canUlt) {
    if (!p.ultiCharging) {
      p.ultiCharging = true;
      p.ultiChargeProgress = 0;
      p.ultiMaxTimer = 0;
      p.ultiLockTimer = 0;
      p.ultiLocked = false;
    }
    p.ultiChargeProgress = Math.min(1, p.ultiChargeProgress + dt / 1.2);
    if (p.ultiChargeProgress >= 1.0) {
      p.ultiMaxTimer += dt;
      const distToTarget = Math.hypot(target.x - p.x, target.y - p.y);
      const angleToTarget = Math.atan2(target.y - p.y, target.x - p.x);
      let angleDiff = Math.abs(p.aimAngle - angleToTarget);
      while (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;
      if (angleDiff < 0.22 && distToTarget < 600 && !target.dead) {
        p.ultiLockTimer += dt;
        if (p.ultiLockTimer >= 0.4) p.ultiLocked = true;
      } else {
        p.ultiLockTimer = Math.max(0, p.ultiLockTimer - dt * 2);
        if (p.ultiLockTimer < 0.2) p.ultiLocked = false;
      }
      if (p.ultiMaxTimer >= 0.6 || p.ultiLocked) {
        const hitDmg = fireUlt(p, target, 1.0);
        p.xp = 0;
        p.ultiCharging = false;
        if (gameMode === 'online' && p === player && conn && conn.open) {
          const end = p.ultiBeam ? { x1: p.ultiBeam.x1, y1: p.ultiBeam.y1, x2: p.ultiBeam.x2, y2: p.ultiBeam.y2 } : { x1:0,y1:0,x2:0,y2:0 };
          conn.send(JSON.stringify({ type: 'fireUlt', chargeLevel: 1.0, beamDuration: p.ultiBeam ? p.ultiBeam.maxTimer : 0.3, x1: end.x1, y1: end.y1, x2: end.x2, y2: end.y2 }));
          if (hitDmg > 0) {
            conn.send(JSON.stringify({ type: 'hit', damage: hitDmg, bulletX: target.x, bulletY: target.y, isUlt: true }));
          }
          if (target.dead) {
            conn.send(JSON.stringify({ type: 'gameOver', winner: isHost ? 'host' : 'guest' }));
          }
        }
      }
    }
  } else if (!chargeDown && p.ultiCharging) {
    if (p.ultiChargeProgress >= 0.25) {
      const hitDmg = fireUlt(p, target, p.ultiChargeProgress);
      p.xp = 0;
      if (gameMode === 'online' && p === player && conn && conn.open) {
        const end = p.ultiBeam ? { x1: p.ultiBeam.x1, y1: p.ultiBeam.y1, x2: p.ultiBeam.x2, y2: p.ultiBeam.y2 } : { x1:0,y1:0,x2:0,y2:0 };
        conn.send(JSON.stringify({ type: 'fireUlt', chargeLevel: p.ultiChargeProgress, beamDuration: p.ultiBeam ? p.ultiBeam.maxTimer : 0.3, x1: end.x1, y1: end.y1, x2: end.x2, y2: end.y2 }));
        if (hitDmg > 0) {
          conn.send(JSON.stringify({ type: 'hit', damage: hitDmg, bulletX: target.x, bulletY: target.y, isUlt: true }));
        }
        if (target.dead) {
          conn.send(JSON.stringify({ type: 'gameOver', winner: isHost ? 'host' : 'guest' }));
        }
      }
    }
    p.ultiCharging = false;
    p.ultiChargeProgress = 0;
    p.ultiMaxTimer = 0;
    p.ultiLockTimer = 0;
    p.ultiLocked = false;
  }

  if (p.arrowCd > 0) {
    p.arrowCd -= dt;
    if (p.arrowCd <= 0) p.arrowCd = 0;
  }

  const bowDown = (p === player) ? mouseLeftDown : false;
  if (bowDown && p.arrowCd <= 0 && !p.ultiCharging) {
    if (!p.bowCharging) {
      p.bowCharging = true;
      p.bowCharge = 0;
    }
    p.bowCharge = Math.min(1, p.bowCharge + dt / 0.5);
  } else if (p.bowCharging && !bowDown) {
    if (p.bowCharge >= 0.4) {
      fireBullet(p, bullets);
      p.arrowCd = 0.18;
      if (gameMode === 'online' && p === player && conn && conn.open) {
        const charge = p.bowCharge;
        const angle = p.aimAngle;
        const end = getBeamEnd(p.x, p.y, angle);
        conn.send(JSON.stringify({ type: 'fireBullet', charge, angle,
          x1: p.x + Math.cos(angle) * (p.r + 4),
          y1: p.y + Math.sin(angle) * (p.r + 4),
          x2: end.x, y2: end.y
        }));
      }
    }
    p.bowCharge = 0;
    p.bowCharging = false;
  }

  if ((p === player) && !p.bowCharging && !mouseLeftDown && p.bowCharge < 0.4 && p.bowCharge > 0) {
    p.bowCharge = Math.max(0, p.bowCharge - dt * 5);
  }
}

function updatePlayerMovement(p, dt, ax, ay) {
  // Dash
  if (p.dashCd > 0) p.dashCd -= dt;
  if (p.invuln > 0) p.invuln -= dt;
  if (p.dashTimer > 0) {
    p.dashTimer -= dt;
    p.vx = p._dashVx * (p.dashTimer / 0.15);
    p.vy = p._dashVy * (p.dashTimer / 0.15);
    if (p.dashTimer <= 0) { p.dashing = false; p._dashVx = 0; p._dashVy = 0; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  } else {
    const ultSlow = p.ultiCharging ? 0.35 : 1;
    const bowSlow = p.bowCharging ? 0.6 : 1;
    const speedMul = ultSlow * bowSlow;
    p.vx += (ax * BASE_SPEED * speedMul - p.vx) * 5 * dt;
    p.vy += (ay * BASE_SPEED * speedMul - p.vy) * 5 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  p.x = Math.max(p.r, Math.min(W - p.r, p.x));
  p.y = Math.max(p.r, Math.min(H - p.r, p.y));
}

function tryDash(p) {
  if (p.dashCd > 0 || p.dashing || p.dead || p.ultiCharging) return;
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy = -1;
  if (keys['s'] || keys['arrowdown']) dy = 1;
  if (keys['a'] || keys['arrowleft']) dx = -1;
  if (keys['d'] || keys['arrowright']) dx = 1;
  if (dx === 0 && dy === 0) { dx = Math.cos(p.aimAngle); dy = Math.sin(p.aimAngle); }
  const len = Math.hypot(dx, dy) || 1;
  const speed = BASE_SPEED * 2.2;
  p._dashVx = dx / len * speed;
  p._dashVy = dy / len * speed;
  p.dashing = true;
  p.dashTimer = 0.15;
  p.dashCd = p.dashMaxCd;
  p.invuln = 0.18;
  spawnExplosion(p.x, p.y, COLORS[p.colorIdx].hex, 8);
  snd(300, 0.1, 'triangle', 0.05);
}

function updateAI(dt) {
  if (!ai || ai.dead || matchOver || killCam.active || roundPause > 0) return;

  if (ai.ultiCooldown > 0) { ai.ultiCooldown -= dt; if (ai.ultiCooldown <= 0) ai.ultiCooldown = 0; }

  const distToPlayer = Math.hypot(ai.x - player.x, ai.y - player.y);
  const angleToPlayer = Math.atan2(player.y - ai.y, player.x - ai.x);

  ai.learnTimer += dt;
  if (ai.learnTimer > 0.08 && distToPlayer < 600 && !player.dead) {
    ai.learnTimer = 0;
    const dx = player.x - ai.prevPlayerX;
    const dy = player.y - ai.prevPlayerY;
    if (ai.prevPlayerX !== 0) {
      const predX = player.x + dx * 2.5;
      const predY = player.y + dy * 2.5;
      const predAngle = Math.atan2(predY - ai.y, predX - ai.x);
      let offset = predAngle - angleToPlayer;
      while (offset > Math.PI) offset -= Math.PI * 2;
      while (offset < -Math.PI) offset += Math.PI * 2;
      ai.predictedOffset += (offset - ai.predictedOffset) * 0.25;
    }
    ai.prevPlayerX = player.x;
    ai.prevPlayerY = player.y;
  }

  let targetAngle = angleToPlayer + (ai.predictedOffset || 0) * ai.difficulty * 1.2;
  while (targetAngle > Math.PI) targetAngle -= Math.PI * 2;
  while (targetAngle < -Math.PI) targetAngle += Math.PI * 2;

  ai.aimNoise += (Math.random() - 0.5) * 0.3 * dt;
  ai.aimNoise = Math.max(-0.15, Math.min(0.15, ai.aimNoise * 0.95));
  const wobble = ai.aimNoise * Math.max(0, 1.0 / ai.difficulty - 0.3);
  ai.aimAngle += (targetAngle + wobble - ai.aimAngle) * Math.min(1, 8 * ai.difficulty * dt);

  if (ai.arrowCd > 0) { ai.arrowCd -= dt; if (ai.arrowCd <= 0) ai.arrowCd = 0; }

  if (!player.dead && ai.arrowCd <= 0 && !ai.ultiCharging && distToPlayer < 500) {
    let angleDiff = Math.abs(ai.aimAngle - angleToPlayer);
    while (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;
    const fireAngleThreshold = 0.12 + 0.46 / ai.difficulty;
    if (!ai.bowCharging) {
      if (angleDiff < fireAngleThreshold && Math.random() < dt * 3 * ai.difficulty) {
        ai.bowCharging = true; ai.bowCharge = 0;
      }
    } else {
      ai.bowCharge = Math.min(1, ai.bowCharge + dt / 0.5);
      const shouldFire = (ai.bowCharge >= 0.85) || (ai.bowCharge >= 0.5 && Math.random() < dt * 2)
        || (angleDiff > fireAngleThreshold * 2 && ai.bowCharge >= 0.4);
      if (shouldFire && ai.bowCharge >= 0.4) {
        fireBullet(ai, oppBullets);
        ai.bowCharge = 0; ai.bowCharging = false; ai.arrowCd = 0.25;
      }
    }
  }

  // AI ult
  if (!player.dead && ai.ultiCooldown <= 0 && ai.xp >= ai.maxXp) {
    let angleDiff = Math.abs(ai.aimAngle - angleToPlayer);
    while (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;
    const ultDistThreshold = 320 + ai.difficulty * 80;
    const ultAngleThreshold = 0.08 + 0.34 / ai.difficulty;
    if (!ai.ultiCharging) {
      if (distToPlayer < ultDistThreshold && angleDiff < ultAngleThreshold && Math.random() < dt * 1.5 * ai.difficulty) {
        ai.ultiCharging = true; ai.ultiChargeProgress = 0; ai.ultiMaxTimer = 0; ai.ultiLockTimer = 0; ai.ultiLocked = false;
        if (ai.bowCharging) { ai.bowCharging = false; ai.bowCharge = 0; }
      }
    } else {
      ai.ultiChargeProgress = Math.min(1, ai.ultiChargeProgress + dt / 1.2);
      if (ai.ultiChargeProgress >= 1.0) {
        ai.ultiMaxTimer += dt;
        if (angleDiff < ultAngleThreshold * 0.6 && !player.dead) {
          ai.ultiLockTimer += dt;
          if (ai.ultiLockTimer >= 0.4) ai.ultiLocked = true;
        } else {
          ai.ultiLockTimer = Math.max(0, ai.ultiLockTimer - dt * 2);
          if (ai.ultiLockTimer < 0.2) ai.ultiLocked = false;
        }
        if (ai.ultiMaxTimer >= 0.6 || ai.ultiLocked) {
          fireUlt(ai, player, 1.0); ai.xp = 0;
          ai.ultiCharging = false; ai.ultiMaxTimer = 0; ai.ultiLockTimer = 0; ai.ultiLocked = false;
        }
      }
      if (angleDiff > ultAngleThreshold * 2.5) {
        if (ai.ultiChargeProgress >= 0.25) { fireUlt(ai, player, ai.ultiChargeProgress); ai.xp = 0; }
        ai.ultiCharging = false; ai.ultiChargeProgress = 0; ai.ultiMaxTimer = 0; ai.ultiLockTimer = 0; ai.ultiLocked = false;
      }
    }
  }

  const ultSlow = ai.ultiCharging ? 0.35 : 1;
  const bowSlow = ai.bowCharging ? 0.6 : 1;
  const speedMul = ultSlow * bowSlow;

  let threatVx = 0, threatVy = 0;
  const dodgeIntensity = 0.4 + ai.difficulty * 0.6;
  for (const b of bullets) {
    const d = Math.hypot(ai.x - b.x, ai.y - b.y);
    if (d < 200 && d > 0) {
      const force = 500 / (d * d) * 100 * dodgeIntensity;
      threatVx += (ai.x - b.x) / d * force;
      threatVy += (ai.y - b.y) / d * force;
    }
  }

  if (player.ultiCharging && !player.dead) {
    const plAngleToAI = Math.atan2(ai.y - player.y, ai.x - player.x);
    let plAimDiff = Math.abs(player.aimAngle - plAngleToAI);
    while (plAimDiff > Math.PI) plAimDiff = Math.PI * 2 - plAimDiff;
    const ultThreat = plAimDiff < 0.5 && distToPlayer < 700;
    if (ultThreat) {
      const closeDanger = plAimDiff < 0.25 && distToPlayer < 400;
      if (closeDanger && player.ultiChargeProgress > 0.5) {
        if (ai.bowCharging) { ai.bowCharging = false; ai.bowCharge = 0; }
        if (ai.ultiCharging) { ai.ultiCharging = false; ai.ultiChargeProgress = 0; ai.ultiMaxTimer = 0; ai.ultiLockTimer = 0; ai.ultiLocked = false; }
      }
      ai.dodgeVx = 0; ai.dodgeVy = 0;
      const urgency = closeDanger ? 1 : (player.ultiChargeProgress >= 0.6 ? 0.8 : 0.4);
      const dodgeScale = 0.5 + ai.difficulty * 0.5;
      const boost = 540 + urgency * 460 * dodgeScale;
      const dodgeAngle = player.aimAngle + (Math.random() > 0.5 ? 1 : -1) * (Math.PI / 2 + (Math.random() - 0.5) * 0.3);
      threatVx += Math.cos(dodgeAngle) * boost;
      threatVy += Math.sin(dodgeAngle) * boost;
      if (closeDanger && player.ultiChargeProgress > 0.3) ai.orbitAngle += dt * 3;
      if (!closeDanger && ai.xp >= ai.maxXp && ai.ultiCooldown <= 0 && !ai.ultiCharging) {
        let ownDiff = Math.abs(ai.aimAngle - angleToPlayer);
        while (ownDiff > Math.PI) ownDiff = Math.PI * 2 - ownDiff;
        if (ownDiff < 0.12 + 0.36 / ai.difficulty && Math.random() < dt * 4 * ai.difficulty) {
          ai.ultiCharging = true; ai.ultiChargeProgress = 0; ai.ultiMaxTimer = 0; ai.ultiLockTimer = 0; ai.ultiLocked = false;
        }
      }
    }
  }

  if (!player.dead) {
    const orbitDist = 220 + Math.random() * 80;
    const hpRatio = ai.hp / ai.maxHp;
    const orbitSpeed = hpRatio < 0.3 ? 2.5 : hpRatio < 0.5 ? 1.8 : 0.8 + ai.difficulty * 0.4;
    const retreatDist = hpRatio < 0.3 ? 130 : hpRatio < 0.5 ? 60 : 0;
    ai.orbitAngle += dt * orbitSpeed;
    const desiredX = player.x + Math.cos(ai.orbitAngle) * (orbitDist + retreatDist);
    const desiredY = player.y + Math.sin(ai.orbitAngle) * (orbitDist + retreatDist);
    const toTargetDist = Math.hypot(desiredX - ai.x, desiredY - ai.y) || 1;
    threatVx += (desiredX - ai.x) / toTargetDist * 400;
    threatVy += (desiredY - ai.y) / toTargetDist * 400;
  }

  ai.dodgeTimer -= dt;
  if (ai.dodgeTimer <= 0) {
    ai.dodgeTimer = (0.35 - ai.difficulty * 0.1) + Math.random() * (0.5 - ai.difficulty * 0.1);
    ai.dodgeVx = (Math.random() - 0.5) * 240;
    ai.dodgeVy = (Math.random() - 0.5) * 240;
  }

  const maxSpeed = BASE_SPEED * speedMul;
  ai.vx += ((ai.dodgeVx + threatVx) - ai.vx) * 5 * dt;
  ai.vy += ((ai.dodgeVy + threatVy) - ai.vy) * 5 * dt;
  const speed = Math.hypot(ai.vx, ai.vy);
  if (speed > maxSpeed) { ai.vx = ai.vx / speed * maxSpeed; ai.vy = ai.vy / speed * maxSpeed; }

  ai.x += ai.vx * dt; ai.y += ai.vy * dt;
  ai.x = Math.max(ai.r, Math.min(W - ai.r, ai.x));
  ai.y = Math.max(ai.r, Math.min(H - ai.r, ai.y));
}

function update(dt) {
  if (!gameMode || matchOver) return;

  if (gameMode === 'ai') {
    updatePlayerInput(player, dt);
    updateAI(dt);

    let ax = 0, ay = 0;
    if (keys['w'] || keys['arrowup']) ay -= 1;
    if (keys['s'] || keys['arrowdown']) ay += 1;
    if (keys['a'] || keys['arrowleft']) ax -= 1;
    if (keys['d'] || keys['arrowright']) ax += 1;
    if (ax !== 0 || ay !== 0) { const len = Math.hypot(ax, ay); ax /= len; ay /= len; }
    updatePlayerMovement(player, dt, ax, ay);
  }

  if (gameMode === 'online') {
    // Apply remote state to opponent (interpolation)
    if (remoteState && remoteReady) {
      opponent.x = remoteState.x;
      opponent.y = remoteState.y;
      opponent.vx = remoteState.vx;
      opponent.vy = remoteState.vy;
      opponent.aimAngle = remoteState.aimAngle;
      opponent.bowCharging = remoteState.bowCharging;
      opponent.bowCharge = remoteState.bowCharge;
      opponent.arrowCd = remoteState.arrowCd;
      opponent.ultiCharging = remoteState.ultiCharging;
      opponent.ultiChargeProgress = remoteState.ultiChargeProgress;
      opponent.ultiCooldown = remoteState.ultiCooldown;
      opponent.xp = remoteState.xp;
      opponent.hp = remoteState.hp;
      opponent.dead = remoteState.dead;
    }

    updatePlayerInput(player, dt);

    let ax = 0, ay = 0;
    if (keys['w'] || keys['arrowup']) ay -= 1;
    if (keys['s'] || keys['arrowdown']) ay += 1;
    if (keys['a'] || keys['arrowleft']) ax -= 1;
    if (keys['d'] || keys['arrowright']) ax += 1;
    if (ax !== 0 || ay !== 0) { const len = Math.hypot(ax, ay); ax /= len; ay /= len; }
    updatePlayerMovement(player, dt, ax, ay);

    // Calculate opponent movement based on received vx/vy
    opponent.x += opponent.vx * dt;
    opponent.y += opponent.vy * dt;
    opponent.x = Math.max(opponent.r, Math.min(W - opponent.r, opponent.x));
    opponent.y = Math.max(opponent.r, Math.min(H - opponent.r, opponent.y));

    sendTimer += dt;
    if (sendTimer >= SEND_INTERVAL) {
      sendTimer = 0;
      sendState();
    }
  }

  gridOffsetX = 0;
  gridOffsetY = 0;

  // Update bullet rays (timers only)
  for (const arr of [bullets, oppBullets]) {
    for (let i = arr.length - 1; i >= 0; i--) {
      arr[i].timer -= dt;
      if (arr[i].timer <= 0) arr.splice(i, 1);
    }
  }

  // Update ult beams
  for (const p of [player, opponent, ai]) {
    if (p && p.ultiBeam) {
      p.ultiBeam.timer -= dt;
      if (p.ultiBeam.timer <= 0) p.ultiBeam = null;
    }
  }

  // Kill cam
  if (killCam.active) {
    killCam.timer -= dt;
    const intensity = killCam.timer / killCam.maxTimer;
    killCam.shakeX = (Math.random() - 0.5) * intensity * 40;
    killCam.shakeY = (Math.random() - 0.5) * intensity * 40;
    killCam.flashAlpha = Math.max(0, intensity * 0.6 - 0.2);
    if (killCam.timer <= 0) {
      killCam.active = false;
      // Round system: best of 3 (2 wins)
      if (gameMode === 'ai' || gameMode === 'online') {
        if (killCam.winner === 'player') roundWins.p1++;
        else roundWins.p2++;
        if (roundWins.p1 >= ROUNDS_TO_WIN || roundWins.p2 >= ROUNDS_TO_WIN) {
          matchOver = true;
          const msg = document.getElementById('msg-overlay');
          msg.style.display = 'block';
          const won = roundWins.p1 >= ROUNDS_TO_WIN;
          msg.textContent = won ? '比赛胜利！按 R 重来' : (gameMode === 'ai' ? 'AI 获胜！按 R 重来' : '你输了！按 R 重来');
          const oppName = gameMode === 'ai' ? 'AI' : (remoteUser ? remoteUser.name : '对手');
          recordMatch(gameMode, oppName, won, roundWins.p1, roundWins.p2);
        } else {
          roundPause = 1.5; // Brief pause then reset positions
        }
      } else {
        gameOver = true;
      }
    }
  }

  // Round pause
  if (roundPause > 0) {
    roundPause -= dt;
    if (roundPause <= 0) resetRound();
  }

  // Screen shake decay
  if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 30);

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt;
    if (p.type === 'shatter') {
      p.vx *= 0.92; p.vy *= 0.92;
      p.rot += p.rotSpd * dt;
    } else {
      p.vx *= 0.94; p.vy *= 0.94;
    }
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Damage numbers decay
  for (let i = dmgNumbers.length - 1; i >= 0; i--) {
    dmgNumbers[i].life -= dt;
    if (dmgNumbers[i].life <= 0) dmgNumbers.splice(i, 1);
  }

  updateHUD();
}

// ===================== 渲染 =====================
function drawGrid() {
  // Minor grid lines
  ctx.strokeStyle = 'rgba(30,35,50,0.4)';
  ctx.lineWidth = 0.5;
  for (let x = gridOffsetX; x < W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, H); ctx.stroke();
  }
  for (let y = gridOffsetY; y < H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, Math.round(y) + 0.5); ctx.lineTo(W, Math.round(y) + 0.5); ctx.stroke();
  }
  // Major axes (center lines)
  ctx.strokeStyle = 'rgba(50,60,80,0.5)';
  ctx.lineWidth = 0.8;
  const cx = Math.round(W / 2 / gridSize) * gridSize + gridOffsetX;
  const cy = Math.round(H / 2 / gridSize) * gridSize + gridOffsetY;
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();
}

function drawSquare(x, y, r, angle, color, glowColor, chargeProgress, isCharging, bowCharge, bowCharging) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle + Math.PI / 4);

  const hex = color;
  const rc = parseInt(hex.slice(1,3), 16);
  const gc = parseInt(hex.slice(3,5), 16);
  const bc = parseInt(hex.slice(5,7), 16);

  // Faint filled square
  ctx.fillStyle = `rgba(${rc},${gc},${bc},0.08)`;
  const hs = r * 0.85;
  ctx.fillRect(-hs, -hs, hs * 2, hs * 2);

  // Clean outline
  ctx.strokeStyle = `rgba(${rc},${gc},${bc},0.9)`;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(-hs, -hs, hs * 2, hs * 2);

  // Center dot (coordinate origin style)
  ctx.fillStyle = `rgba(${rc},${gc},${bc},0.6)`;
  ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();

  // Diagonal cross inside square (like math plot axis markers)
  const ds = hs * 0.5;
  ctx.strokeStyle = `rgba(${rc},${gc},${bc},0.25)`;
  ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(-ds, -ds); ctx.lineTo(ds, ds); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ds, -ds); ctx.lineTo(-ds, ds); ctx.stroke();

  // Ult charging: dashed circle progress
  if (isCharging && chargeProgress > 0) {
    ctx.strokeStyle = `rgba(${rc},${gc},${bc},${0.3 + chargeProgress * 0.5})`;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.arc(0, 0, r + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * chargeProgress);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Bow charging: dashed arc
  if (bowCharging && bowCharge > 0 && !isCharging) {
    ctx.strokeStyle = `rgba(${rc},${gc},${bc},${0.2 + bowCharge * 0.5})`;
    ctx.lineWidth = 1.2;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * bowCharge);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore();
}

function drawUltBeam(beam) {
  if (!beam || beam.timer <= 0) return;
  const alpha = beam.timer / beam.maxTimer;
  const hex = beam.color;
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const chargeLevel = beam.chargeLevel || 0.5;

  const dx = beam.x2 - beam.x1;
  const dy = beam.y2 - beam.y1;
  const dist = Math.hypot(dx, dy);
  if (dist < 1) return;
  const perpX = -dy / dist;
  const perpY = dx / dist;
  const freq = 2 + chargeLevel * 5;
  const amp = 8 + chargeLevel * 16;

  // Draw the sine wave with multiple layers (thin to thick) for a clean math look
  const layerStyles = [
    { w: 6, a: alpha * 0.12, dash: [] },
    { w: 4, a: alpha * 0.25, dash: [] },
    { w: 1.5, a: alpha * 0.7, dash: [] },
  ];

  for (const ls of layerStyles) {
    ctx.strokeStyle = `rgba(${r},${g},${b},${ls.a})`;
    ctx.lineWidth = ls.w;
    ctx.setLineDash(ls.dash);
    ctx.beginPath();
    const steps = Math.floor(dist / 4);
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const px = beam.x1 + dx * t;
      const py = beam.y1 + dy * t;
      const envelope = Math.sin(t * Math.PI);
      const offset = Math.sin(t * Math.PI * 2 * freq) * amp * envelope;
      const sx = px + perpX * offset;
      const sy = py + perpY * offset;
      if (i === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Center bright core
  ctx.strokeStyle = `rgba(${Math.min(255,r+40)},${Math.min(255,g+40)},${Math.min(255,b+40)},${alpha * 0.9})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  const st = Math.floor(dist / 4);
  for (let i = 0; i <= st; i++) {
    const t = i / st;
    const px = beam.x1 + dx * t;
    const py = beam.y1 + dy * t;
    const envelope = Math.sin(t * Math.PI);
    const offset = Math.sin(t * Math.PI * 2 * freq) * amp * envelope;
    if (i === 0) ctx.moveTo(px + perpX * offset, py + perpY * offset);
    else ctx.lineTo(px + perpX * offset, py + perpY * offset);
  }
  ctx.stroke();
}

function draw() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  // Draw background (menu or game)
  if (gameMode) {
    ctx.save();
    if (killCam.active) {
      const intensity = killCam.timer / killCam.maxTimer;
      const zoom = 1 + intensity * 0.15;
      ctx.translate(W / 2, H / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-W / 2 + killCam.shakeX, -H / 2 + killCam.shakeY);
    } else if (screenShake > 0.3) {
      const sx = (Math.random() - 0.5) * screenShake;
      const sy = (Math.random() - 0.5) * screenShake;
      ctx.translate(sx, sy);
    }

    drawGrid();

    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      if (p.type === 'shatter') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        const s = p.size * alpha;
        const r = p.r, g = p.g, b = p.b;
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.9})`;
        ctx.strokeStyle = `rgba(${Math.min(255,r+60)},${Math.min(255,g+60)},${Math.min(255,b+60)},${alpha})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        // Triangle wedge matching the square fragment shape
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(-0.35) * s, Math.sin(-0.35) * s);
        ctx.lineTo(Math.cos(0.35) * s, Math.sin(0.35) * s);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      } else {
        ctx.fillStyle = p.color.replace(')', `,${alpha})`).replace('rgb', 'rgba');
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Damage numbers
    for (const dn of dmgNumbers) {
      const a = dn.life / dn.maxLife;
      ctx.fillStyle = dn.color.replace(')', `,${a})`).replace('rgb', 'rgba');
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(dn.text, dn.x, dn.y - (1 - a) * 18);
    }

    // Draw player bullets
    for (const b of bullets) {
      drawBullet(b);
    }
    // Draw opponent bullets
    for (const b of oppBullets) {
      drawBullet(b);
    }

    // Ult beams
    if (player.ultiBeam) drawUltBeam(player.ultiBeam);
    if (opponent && opponent.ultiBeam) drawUltBeam(opponent.ultiBeam);
    if (ai && ai.ultiBeam) drawUltBeam(ai.ultiBeam);

    // Draw players
    const pColor = COLORS[player.colorIdx].hex;
    const pGlow = COLORS[player.colorIdx].rgb;
    if (!player.dead) {
      drawSquare(player.x, player.y, player.r, player.aimAngle, pColor, pGlow,
        player.ultiChargeProgress, player.ultiCharging, player.bowCharge, player.bowCharging);
    }

    const oColor = COLORS[opponent.colorIdx].hex;
    const oGlow = COLORS[opponent.colorIdx].rgb;
    if (!opponent.dead) {
      drawSquare(opponent.x, opponent.y, opponent.r, opponent.aimAngle, oColor, oGlow,
        opponent.ultiChargeProgress, opponent.ultiCharging, opponent.bowCharge, opponent.bowCharging);
    }

    // Labels
    ctx.fillStyle = pColor;
    ctx.font = '10px "Courier New", monospace';
    ctx.textAlign = 'center';
    if (!player.dead) ctx.fillText(currentUser.name, player.x, player.y - 28);
    ctx.fillStyle = oColor;
    const oName = gameMode === 'ai' ? 'AI' : (remoteUser ? remoteUser.name : '对手');
    if (!opponent.dead) ctx.fillText(oName, opponent.x, opponent.y - 28);

    // Aim line — dashed directional line like function graph asymptote
    if (!player.dead && !matchOver) {
      const end = getBeamEnd(player.x, player.y, player.aimAngle);
      const aimAlpha = player.ultiCharging ? 0.3 : player.bowCharging ? 0.2 : 0.06;
      const aimWidth = player.ultiCharging ? 1.5 : player.bowCharging ? 1 : 0.5;
      ctx.strokeStyle = `rgba(${parseInt(pColor.slice(1,3),16)},${parseInt(pColor.slice(3,5),16)},${parseInt(pColor.slice(5,7),16)},${aimAlpha})`;
      ctx.lineWidth = aimWidth;
      ctx.setLineDash([6, 10]);
      ctx.beginPath();
      ctx.moveTo(player.x + Math.cos(player.aimAngle) * (player.r + 6), player.y + Math.sin(player.aimAngle) * (player.r + 6));
      ctx.lineTo(end.x, end.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Crosshair — coordinate axes style
      const cs = 12;
      const ultiAvailable = player.xp >= player.maxXp && player.ultiCooldown <= 0 && !player.ultiCharging;
      let alpha = player.ultiLocked ? 0.9 : ultiAvailable ? 0.55 + Math.sin(Date.now() * 0.006) * 0.3 : player.ultiCharging ? 0.5 : 0.3;
      if (player.ultiLocked) alpha = 0.8 + Math.sin(Date.now() * 0.015) * 0.2;

      ctx.strokeStyle = `rgba(${parseInt(pColor.slice(1,3),16)},${parseInt(pColor.slice(3,5),16)},${parseInt(pColor.slice(5,7),16)},${alpha})`;
      ctx.lineWidth = 1;
      // Center dot
      ctx.beginPath(); ctx.arc(mouseX, mouseY, 2, 0, Math.PI * 2); ctx.fillStyle = `rgba(${parseInt(pColor.slice(1,3),16)},${parseInt(pColor.slice(3,5),16)},${parseInt(pColor.slice(5,7),16)},${alpha + 0.2})`; ctx.fill();
      // Tick marks (like coordinate axes)
      ctx.beginPath();
      for (let i = -2; i <= 2; i++) {
        if (i === 0) continue;
        const t = i * 6;
        ctx.moveTo(mouseX + t, mouseY - 2); ctx.lineTo(mouseX + t, mouseY + 2);
        ctx.moveTo(mouseX - 2, mouseY + t); ctx.lineTo(mouseX + 2, mouseY + t);
      }
      ctx.stroke();

      // Ult charging progress ring
      if (player.ultiCharging) {
        const pr = 16 + player.ultiChargeProgress * 14;
        ctx.strokeStyle = `rgba(${parseInt(pColor.slice(1,3),16)},${parseInt(pColor.slice(3,5),16)},${parseInt(pColor.slice(5,7),16)},${0.2 + player.ultiChargeProgress * 0.5})`;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 2]);
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, pr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * player.ultiChargeProgress);
        ctx.stroke();
        ctx.setLineDash([]);
        if (player.ultiLocked) {
          ctx.strokeStyle = 'rgba(212,165,116,0.8)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(mouseX, mouseY, pr + 2, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * player.ultiLockTimer / 0.4);
          ctx.stroke();
        }
      } else if (player.bowCharging) {
        const pr = 14 + player.bowCharge * 10;
        ctx.strokeStyle = `rgba(${parseInt(pColor.slice(1,3),16)},${parseInt(pColor.slice(3,5),16)},${parseInt(pColor.slice(5,7),16)},${0.15 + player.bowCharge * 0.4})`;
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 4]);
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, pr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * player.bowCharge);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Locked indicator
      if (player.ultiLocked) {
        ctx.fillStyle = 'rgba(212,165,116,0.8)';
        ctx.font = '11px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('LOCKED', mouseX, mouseY - 22);
      }
    }

    ctx.restore();

    // Kill cam overlay
    if (killCam.active) {
      const intensity = killCam.timer / killCam.maxTimer;
      ctx.fillStyle = `rgba(10,10,15,${killCam.flashAlpha * intensity * 0.6})`;
      ctx.fillRect(0, 0, W, H);

      // Expanding ring
      const expandR = (1 - intensity) * 250 + 30;
      ctx.strokeStyle = `rgba(200,200,200,${intensity * 0.6})`;
      ctx.lineWidth = 1 + intensity * 4;
      ctx.beginPath(); ctx.arc(killCam.posX, killCam.posY, expandR, 0, Math.PI * 2); ctx.stroke();

      if (intensity < 0.6) {
        const isPlayerWin = killCam.winner === 'player';
        const wc = isPlayerWin ? COLORS[player.colorIdx].hex : COLORS[opponent.colorIdx].hex;
        const wr = parseInt(wc.slice(1,3), 16), wg = parseInt(wc.slice(3,5), 16), wb = parseInt(wc.slice(5,7), 16);
        const textAlpha = Math.min(1, (0.6 - intensity) / 0.4);
        ctx.fillStyle = `rgba(${wr},${wg},${wb},${textAlpha})`;
        ctx.font = '24px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(isPlayerWin ? 'Q.E.D.' : 'N.S.F.', W / 2, H / 2 + 8);
      }
    }

    // Bottom hints
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '9px "Courier New", monospace';
    ctx.textAlign = 'left';
    const hint = gameMode === 'ai'
      ? 'L:y=kx | R:sin(x) | Shift:冲刺 | WASD | R:重来 | 1:难度 | Esc:返回'
      : 'L:y=kx | R:sin(x) | Shift:冲刺 | WASD | R:重来 | Esc:返回';
    ctx.fillText(hint, 10, H - 10);
    ctx.textAlign = 'start';

    // AI difficulty indicator
    if (gameMode === 'ai' && ai && ai.difficulty !== 1) {
      ctx.fillStyle = '#666';
      ctx.font = '9px "Courier New", monospace';
      ctx.textAlign = 'right';
      ctx.fillText('AI难度: ' + (ai.difficulty === 0.5 ? '简单' : '困难') + ' (按1切换)', W - 10, H - 10);
      ctx.textAlign = 'start';
    }
  }
}

function drawBullet(b) {
  const progress = 1 - Math.max(0, b.timer / (b.charge > 0 ? 0.08 + b.charge * 0.15 : 0.08));
  const alpha = Math.max(0, b.timer / (b.charge > 0 ? 0.08 + b.charge * 0.15 : 0.08));
  const hex = b.color;
  const rc = parseInt(hex.slice(1,3), 16);
  const gc = parseInt(hex.slice(3,5), 16);
  const bc = parseInt(hex.slice(5,7), 16);
  const charge = b.charge || 0;

  // Ray extends from shooter outward over flight time
  const curX2 = b.x1 + (b.x2 - b.x1) * Math.min(1, progress * 1.3);
  const curY2 = b.y1 + (b.y2 - b.y1) * Math.min(1, progress * 1.3);

  // Flash at origin point (strongest at beginning)
  const flashAlpha = alpha * (1 - progress) * 0.5;
  if (flashAlpha > 0.01) {
    const grad = ctx.createRadialGradient(b.x1, b.y1, 0, b.x1, b.y1, 12 + charge * 6);
    grad.addColorStop(0, `rgba(${rc},${gc},${bc},${flashAlpha})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(b.x1, b.y1, 12 + charge * 6, 0, Math.PI * 2); ctx.fill();
  }

  // Layer 1: Wide glow
  ctx.strokeStyle = `rgba(${rc},${gc},${bc},${alpha * 0.08})`;
  ctx.lineWidth = 10 + charge * 5;
  ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(curX2, curY2); ctx.stroke();

  // Layer 2: Medium glow
  ctx.strokeStyle = `rgba(${rc},${gc},${bc},${alpha * 0.2})`;
  ctx.lineWidth = 4 + charge * 2.5;
  ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(curX2, curY2); ctx.stroke();

  // Layer 3: Main line
  ctx.strokeStyle = `rgba(${rc},${gc},${bc},${alpha * 0.7})`;
  ctx.lineWidth = 1.5 + charge;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(curX2, curY2); ctx.stroke();

  // Layer 4: Bright core
  ctx.strokeStyle = `rgba(${Math.min(255,rc+40)},${Math.min(255,gc+40)},${Math.min(255,bc+40)},${alpha * 0.95})`;
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(curX2, curY2); ctx.stroke();
}

// ===================== 主循环 =====================
let lastTime = 0;
let accumulator = 0;
const fixedDt = 1 / 60;

function loop(time) {
  let rawDt = (time - lastTime) / 1000;
  lastTime = time;
  if (rawDt > 0.1) rawDt = 0.1;
  accumulator += rawDt;
  while (accumulator >= fixedDt) {
    if (gameMode && !gameOver) update(fixedDt);
    accumulator -= fixedDt;
  }
  draw();
  requestAnimationFrame(loop);
}

const ADMIN_PW = 'bie110308';

  hideAll();
  document.getElementById('admin-panel').style.display = '';
  document.getElementById('admin-panel').classList.add('active');
  document.getElementById('admin-pw').value = '';
  document.getElementById('admin-err').textContent = '';
  setTimeout(() => document.getElementById('admin-pw').focus(), 100);
}

function adminVerify() {
  const input = document.getElementById('admin-pw').value;
  if (input === ADMIN_PW) {
    document.getElementById('admin-err').textContent = '密码正确 — 可直接编辑此 HTML 文件修改底层参数';
  } else {
    document.getElementById('admin-err').textContent = '密码错误';
    document.getElementById('admin-pw').value = '';
  }
}

document.getElementById('admin-pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') adminVerify();
});
